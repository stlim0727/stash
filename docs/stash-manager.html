<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Stash Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0f0f13; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #18181f; }
  ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 3px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const BASE_URL = "https://stzutoejnhzxzhjsjtsi.supabase.co/functions/v1/public-api";
const API_KEY = "YOUR_STASH_API_KEY"; // paste your stash_ key here
const HEADERS = {
  "Authorization": `Bearer ${API_KEY}`,
  "Content-Type": "application/json",
};

async function api(path, options = {}) {
  const res = await fetch(`${BASE_URL}${path}`, { headers: HEADERS, ...options });
  if (res.status === 204) return null;
  return res.json();
}

// The `claude-proxy` edge function was an unmetered, unvalidated passthrough to a
// billable Anthropic key and has been removed (see docs/reviews/project-wide-grumpy-review.md, #1).
// The AI 분석 / AI 대화 tabs depended on it, so they now surface a clear "removed"
// notice instead of calling a dead endpoint. The bookmark/tag/collection
// management tabs are unaffected and continue to use the public-api.
const AI_DISABLED_MESSAGE =
  "AI 기능은 비활성화되었습니다. claude-proxy 엔드포인트가 보안상의 이유로 제거되었습니다. " +
  "(The claude-proxy endpoint was removed for security reasons; the AI analysis and chat features are no longer available.)";

async function callClaude(_system, _messages) {
  throw new Error(AI_DISABLED_MESSAGE);
}

function StashManager() {
  const [bookmarks, setBookmarks] = useState([]);
  const [tags, setTags] = useState([]);
  const [collections, setCollections] = useState([]);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [activeTab, setActiveTab] = useState("bookmarks");
  const [analysis, setAnalysis] = useState(null);
  const [analyzing, setAnalyzing] = useState(false);
  const [chat, setChat] = useState([]);
  const [chatInput, setChatInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [filterCollection, setFilterCollection] = useState("");
  const [offset, setOffset] = useState(0);
  const [hasMore, setHasMore] = useState(false);
  const [editingBookmark, setEditingBookmark] = useState(null);
  const [editForm, setEditForm] = useState({});
  const [saving, setSaving] = useState(false);
  const chatEndRef = useRef(null);
  const LIMIT = 50;

  useEffect(() => { loadAll(); }, []);
  useEffect(() => { chatEndRef.current?.scrollIntoView({ behavior: "smooth" }); }, [chat]);

  async function loadAll() {
    setLoading(true);
    setError(null);
    try {
      const [bmData, tagData, colData] = await Promise.all([
        api(`/bookmarks?limit=${LIMIT}&offset=0`),
        api("/tags"),
        api("/collections"),
      ]);
      setBookmarks(bmData?.bookmarks || []);
      setHasMore((bmData?.bookmarks || []).length === LIMIT);
      setOffset(LIMIT);
      setTags(Array.isArray(tagData) ? tagData : []);
      setCollections(Array.isArray(colData) ? colData : []);
    } catch (e) {
      setError(`불러오기 실패: ${e.message}`);
    }
    setLoading(false);
  }

  async function loadMore() {
    try {
      const params = new URLSearchParams({ limit: LIMIT, offset });
      if (searchQuery) params.set("q", searchQuery);
      if (filterCollection) params.set("collection_id", filterCollection);
      const data = await api(`/bookmarks?${params}`);
      const items = data?.bookmarks || [];
      setBookmarks(prev => [...prev, ...items]);
      setHasMore(items.length === LIMIT);
      setOffset(prev => prev + LIMIT);
    } catch (e) {}
  }

  async function search() {
    setLoading(true);
    setOffset(0);
    try {
      const params = new URLSearchParams({ limit: LIMIT, offset: 0 });
      if (searchQuery) params.set("q", searchQuery);
      if (filterCollection) params.set("collection_id", filterCollection);
      const data = await api(`/bookmarks?${params}`);
      setBookmarks(data?.bookmarks || []);
      setHasMore((data?.bookmarks || []).length === LIMIT);
      setOffset(LIMIT);
    } catch (e) {
      setError(`검색 실패: ${e.message}`);
    }
    setLoading(false);
  }

  async function saveEdit() {
    if (!editingBookmark) return;
    setSaving(true);
    try {
      const body = {
        title: editForm.title,
        description: editForm.description,
        notes: editForm.notes,
        collection_id: editForm.collection_id || null,
      };
      const oldTags = (editingBookmark.tags || []).map(t => t.name || t);
      const newTags = (editForm.tags || "").split(",").map(t => t.trim()).filter(Boolean);
      const add_tags = newTags.filter(t => !oldTags.includes(t));
      const remove_tags = oldTags.filter(t => !newTags.includes(t));
      if (add_tags.length) body.add_tags = add_tags;
      if (remove_tags.length) body.remove_tags = remove_tags;
      await api(`/bookmarks/${editingBookmark.id}`, {
        method: "PATCH",
        body: JSON.stringify(body),
      });
      setEditingBookmark(null);
      await loadAll();
    } catch (e) {
      setError(`저장 실패: ${e.message}`);
    }
    setSaving(false);
  }

  async function archiveBookmark(id) {
    if (!confirm("이 북마크를 보관함으로 이동할까요?")) return;
    try {
      await api(`/bookmarks/${id}`, { method: "DELETE" });
      setBookmarks(prev => prev.filter(b => b.id !== id));
    } catch (e) {
      setError(`삭제 실패: ${e.message}`);
    }
  }

  function openEdit(b) {
    setEditingBookmark(b);
    setEditForm({
      title: b.title || "",
      description: b.description || "",
      notes: b.notes || "",
      collection_id: b.collection_id || "",
      tags: (b.tags || []).map(t => t.name || t).join(", "),
    });
  }

  async function analyzeBookmarks() {
    setAnalyzing(true);
    setActiveTab("analysis");
    const sample = bookmarks.slice(0, 80).map(b => ({
      id: b.id, title: b.title, url: b.url,
      tags: (b.tags || []).map(t => t.name || t),
      collection_id: b.collection_id,
      description: b.description || "",
    }));
    try {
      const result = await callClaude(
        "You are a bookmark organization expert. Analyze the user's bookmarks and respond in Korean with clear emoji-headed sections: 1) 📊 현재 상태 요약 2) 🏷️ 태그 정리 제안 (중복/유사 태그 병합) 3) 📁 컬렉션 분류 제안 4) ✅ 액션 아이템 5가지. Be specific with actual tag/title names.",
        [{ role: "user", content: `북마크 ${bookmarks.length}개 (최대 80개):\n${JSON.stringify(sample)}\n\n현재 태그: ${tags.map(t => t.name).join(", ")}\n현재 컬렉션: ${collections.map(c => c.name).join(", ")}` }]
      );
      setAnalysis(result);
    } catch (e) {
      setAnalysis(`분석 오류: ${e.message}`);
    }
    setAnalyzing(false);
  }

  async function sendChat() {
    if (!chatInput.trim() || chatLoading) return;
    const userMsg = chatInput.trim();
    setChatInput("");
    const newChat = [...chat, { role: "user", content: userMsg }];
    setChat(newChat);
    setChatLoading(true);
    const sample = bookmarks.slice(0, 60).map(b => ({
      id: b.id, title: b.title, url: b.url,
      tags: (b.tags || []).map(t => t.name || t),
    }));
    try {
      const reply = await callClaude(
        `당신은 북마크 정리를 도와주는 AI입니다. 사용자의 Stash에는 북마크 ${bookmarks.length}개, 태그 ${tags.length}개, 컬렉션 ${collections.length}개가 있습니다.\n북마크: ${JSON.stringify(sample)}\n태그: ${tags.map(t => t.name).join(", ")}\n컬렉션: ${collections.map(c => c.name).join(", ")}\n한국어로 답하세요.`,
        newChat.map(m => ({ role: m.role, content: m.content }))
      );
      setChat([...newChat, { role: "assistant", content: reply }]);
    } catch (e) {
      setChat([...newChat, { role: "assistant", content: `오류: ${e.message}` }]);
    }
    setChatLoading(false);
  }

  const tagCounts = {};
  bookmarks.forEach(b => {
    (b.tags || []).forEach(t => {
      const name = t.name || t;
      tagCounts[name] = (tagCounts[name] || 0) + 1;
    });
  });

  const s = {
    page: { fontFamily: "'Inter', -apple-system, sans-serif", background: "#0f0f13", minHeight: "100vh", color: "#e2e2e8" },
    header: { background: "#18181f", borderBottom: "1px solid #2a2a35", padding: "14px 20px", display: "flex", alignItems: "center", gap: 12 },
    logo: { width: 32, height: 32, background: "linear-gradient(135deg, #6366f1, #8b5cf6)", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 },
    tabs: { display: "flex", borderBottom: "1px solid #2a2a35", background: "#18181f", overflowX: "auto" },
    tab: (active) => ({ padding: "11px 16px", background: "none", border: "none", whiteSpace: "nowrap", borderBottom: active ? "2px solid #6366f1" : "2px solid transparent", color: active ? "#6366f1" : "#6b7280", cursor: "pointer", fontSize: 13, fontWeight: active ? 600 : 400 }),
    body: { padding: 16, maxWidth: 860, margin: "0 auto" },
    input: { background: "#18181f", border: "1px solid #2a2a35", borderRadius: 8, padding: "9px 13px", color: "#e2e2e8", fontSize: 13, outline: "none" },
    btn: (variant = "secondary") => ({
      border: "none", borderRadius: 7, cursor: "pointer", fontSize: 13, fontWeight: 600, padding: "8px 16px",
      background: variant === "primary" ? "linear-gradient(135deg, #6366f1, #8b5cf6)" : variant === "danger" ? "#7f1d1d" : "#2a2a35",
      color: variant === "primary" ? "#fff" : variant === "danger" ? "#fca5a5" : "#a0a0b0",
    }),
    card: { background: "#18181f", border: "1px solid #2a2a35", borderRadius: 10, padding: "12px 14px" },
    tag: { background: "#1e1e2e", border: "1px solid #3730a3", color: "#818cf8", padding: "2px 7px", borderRadius: 4, fontSize: 11 },
    error: { background: "#2d1b1b", border: "1px solid #5c2d2d", borderRadius: 8, padding: "10px 14px", color: "#f87171", fontSize: 13, marginBottom: 14 },
  };

  const TABS = [
    { id: "bookmarks", label: "📚 북마크" },
    { id: "tags", label: "🏷️ 태그" },
    { id: "collections", label: "📁 컬렉션" },
    { id: "analysis", label: "🔍 AI 분석" },
    { id: "chat", label: "💬 AI 대화" },
  ];

  return (
    <div style={s.page}>
      <div style={s.header}>
        <div style={s.logo}>🔖</div>
        <div>
          <div style={{ fontWeight: 700, fontSize: 15, color: "#fff" }}>Stash Manager</div>
          <div style={{ fontSize: 11, color: "#6b7280" }}>{bookmarks.length}개 북마크 · {tags.length}개 태그 · {collections.length}개 컬렉션</div>
        </div>
        <button onClick={loadAll} style={{ ...s.btn(), marginLeft: "auto" }}>새로고침</button>
      </div>

      <div style={s.tabs}>
        {TABS.map(t => <button key={t.id} onClick={() => setActiveTab(t.id)} style={s.tab(activeTab === t.id)}>{t.label}</button>)}
      </div>

      <div style={s.body}>
        {error && <div style={s.error}>⚠️ {error}</div>}

        {activeTab === "bookmarks" && (
          <div>
            <div style={{ display: "flex", gap: 8, marginBottom: 12, flexWrap: "wrap" }}>
              <input value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
                onKeyDown={e => e.key === "Enter" && search()}
                placeholder="제목, URL, 메모 검색..." style={{ ...s.input, flex: 1, minWidth: 160 }} />
              <select value={filterCollection} onChange={e => setFilterCollection(e.target.value)}
                style={{ ...s.input, minWidth: 120 }}>
                <option value="">전체 컬렉션</option>
                <option value="null">미분류</option>
                {collections.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
              <button onClick={search} style={s.btn("primary")}>검색</button>
            </div>
            {loading ? (
              <div style={{ textAlign: "center", padding: 40, color: "#6b7280" }}>불러오는 중...</div>
            ) : bookmarks.length === 0 ? (
              <div style={{ textAlign: "center", padding: 40, color: "#6b7280" }}>북마크 없음</div>
            ) : (
              <>
                <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
                  {bookmarks.map((b, i) => (
                    <div key={b.id || i} style={s.card}>
                      <div style={{ display: "flex", alignItems: "flex-start", gap: 8 }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <a href={b.url} target="_blank" rel="noopener noreferrer"
                            style={{ color: "#a5b4fc", fontWeight: 600, fontSize: 14, textDecoration: "none", display: "block", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>
                            {b.title || b.url}
                          </a>
                          <div style={{ color: "#4b5563", fontSize: 11, marginTop: 1, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{b.url}</div>
                          {b.description && <div style={{ color: "#6b7280", fontSize: 12, marginTop: 4 }}>{b.description}</div>}
                          {(b.tags || []).length > 0 && (
                            <div style={{ display: "flex", flexWrap: "wrap", gap: 4, marginTop: 6 }}>
                              {(b.tags || []).map((t, j) => <span key={j} style={s.tag}>{t.name || t}</span>)}
                            </div>
                          )}
                        </div>
                        <div style={{ display: "flex", gap: 4, flexShrink: 0 }}>
                          <button onClick={() => openEdit(b)} style={{ ...s.btn(), fontSize: 11, padding: "4px 10px" }}>편집</button>
                          <button onClick={() => archiveBookmark(b.id)} style={{ ...s.btn("danger"), fontSize: 11, padding: "4px 10px" }}>삭제</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
                {hasMore && (
                  <div style={{ textAlign: "center", marginTop: 14 }}>
                    <button onClick={loadMore} style={s.btn()}>더 보기</button>
                  </div>
                )}
              </>
            )}
          </div>
        )}

        {activeTab === "tags" && (
          <div>
            <div style={{ color: "#6b7280", fontSize: 13, marginBottom: 14 }}>총 {tags.length}개 태그</div>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {Object.entries(tagCounts).sort((a, b) => b[1] - a[1]).map(([name, count]) => (
                <div key={name} style={{ ...s.card, padding: "7px 12px", display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ color: "#a5b4fc", fontSize: 13 }}>{name}</span>
                  <span style={{ background: "#1e1e2e", color: "#6366f1", fontSize: 11, padding: "1px 6px", borderRadius: 10, fontWeight: 600 }}>{count}</span>
                </div>
              ))}
              {tags.filter(t => !tagCounts[t.name]).map(t => (
                <div key={t.id} style={{ ...s.card, padding: "7px 12px", display: "flex", alignItems: "center", gap: 8 }}>
                  <span style={{ color: "#a5b4fc", fontSize: 13 }}>{t.name}</span>
                  <span style={{ background: "#1e1e2e", color: "#6366f1", fontSize: 11, padding: "1px 6px", borderRadius: 10, fontWeight: 600 }}>0</span>
                </div>
              ))}
            </div>
          </div>
        )}

        {activeTab === "collections" && (
          <div>
            <div style={{ color: "#6b7280", fontSize: 13, marginBottom: 14 }}>총 {collections.length}개 컬렉션</div>
            <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
              {collections.map(c => (
                <div key={c.id} style={{ ...s.card, display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ fontSize: 20 }}>📁</div>
                  <div style={{ flex: 1 }}>
                    <div style={{ color: "#fff", fontWeight: 600, fontSize: 14 }}>{c.name}</div>
                    {c.description && <div style={{ color: "#6b7280", fontSize: 12, marginTop: 2 }}>{c.description}</div>}
                  </div>
                  <button onClick={() => { setFilterCollection(c.id); setActiveTab("bookmarks"); search(); }}
                    style={{ ...s.btn(), fontSize: 11, padding: "4px 10px" }}>보기</button>
                </div>
              ))}
            </div>
          </div>
        )}

        {activeTab === "analysis" && (
          <div>
            {!analysis && !analyzing && (
              <div style={{ textAlign: "center", padding: "50px 0" }}>
                <div style={{ fontSize: 48, marginBottom: 12 }}>🔍</div>
                <div style={{ color: "#9ca3af", marginBottom: 20 }}>AI가 북마크를 분석하고 정리 방안을 제안합니다</div>
                <button onClick={analyzeBookmarks} disabled={bookmarks.length === 0} style={s.btn("primary")}>분석 시작</button>
              </div>
            )}
            {analyzing && (
              <div style={{ textAlign: "center", padding: "50px 0", color: "#6b7280" }}>
                <div style={{ fontSize: 32, marginBottom: 12 }}>⏳</div>
                AI가 {bookmarks.length}개 북마크 분석 중...
              </div>
            )}
            {analysis && !analyzing && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
                  <div style={{ fontWeight: 600, color: "#fff" }}>분석 결과</div>
                  <button onClick={analyzeBookmarks} style={s.btn()}>재분석</button>
                </div>
                <div style={{ ...s.card, lineHeight: 1.8, fontSize: 14, whiteSpace: "pre-wrap", color: "#d1d5db" }}>{analysis}</div>
                <div style={{ marginTop: 10, padding: "10px 14px", background: "#1a1a2e", border: "1px solid #2d2d4a", borderRadius: 8, fontSize: 12, color: "#6b7280" }}>
                  💡 <strong style={{ color: "#818cf8" }}>💬 AI 대화</strong> 탭에서 더 구체적으로 논의해 보세요.
                </div>
              </div>
            )}
          </div>
        )}

        {activeTab === "chat" && (
          <div style={{ display: "flex", flexDirection: "column", height: "calc(100vh - 230px)" }}>
            <div style={{ flex: 1, overflowY: "auto", display: "flex", flexDirection: "column", gap: 10, paddingBottom: 10 }}>
              {chat.length === 0 && (
                <div style={{ textAlign: "center", padding: "40px 0", color: "#6b7280" }}>
                  <div style={{ fontSize: 36, marginBottom: 10 }}>💬</div>
                  <div style={{ marginBottom: 6 }}>북마크에 대해 무엇이든 물어보세요</div>
                  <div style={{ fontSize: 12, color: "#4b5563" }}>예: "여행 북마크 정리해줘" · "중복 태그 있나?" · "기술 북마크 분류해줘"</div>
                </div>
              )}
              {chat.map((m, i) => (
                <div key={i} style={{ display: "flex", justifyContent: m.role === "user" ? "flex-end" : "flex-start" }}>
                  <div style={{
                    maxWidth: "82%", borderRadius: 12, padding: "10px 14px", fontSize: 14, lineHeight: 1.6, whiteSpace: "pre-wrap",
                    background: m.role === "user" ? "linear-gradient(135deg, #4f46e5, #7c3aed)" : "#18181f",
                    border: m.role === "user" ? "none" : "1px solid #2a2a35",
                    color: m.role === "user" ? "#fff" : "#d1d5db",
                  }}>{m.content}</div>
                </div>
              ))}
              {chatLoading && (
                <div style={{ display: "flex" }}>
                  <div style={{ ...s.card, color: "#6b7280", fontSize: 13 }}>답변 생성 중...</div>
                </div>
              )}
              <div ref={chatEndRef} />
            </div>
            <div style={{ display: "flex", gap: 8, paddingTop: 10, borderTop: "1px solid #2a2a35" }}>
              <input value={chatInput} onChange={e => setChatInput(e.target.value)}
                onKeyDown={e => e.key === "Enter" && !e.shiftKey && sendChat()}
                placeholder="북마크 정리에 대해 물어보세요..."
                style={{ ...s.input, flex: 1 }} />
              <button onClick={sendChat} disabled={chatLoading || !chatInput.trim()}
                style={{ ...s.btn("primary"), opacity: chatLoading || !chatInput.trim() ? 0.5 : 1 }}>전송</button>
            </div>
          </div>
        )}
      </div>

      {editingBookmark && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.7)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 100, padding: 16 }}>
          <div style={{ background: "#18181f", border: "1px solid #2a2a35", borderRadius: 14, padding: 20, width: "100%", maxWidth: 480, maxHeight: "90vh", overflowY: "auto" }}>
            <div style={{ fontWeight: 700, color: "#fff", fontSize: 15, marginBottom: 16 }}>북마크 편집</div>
            {[
              { label: "제목", key: "title" },
              { label: "설명", key: "description" },
              { label: "메모", key: "notes" },
              { label: "태그 (쉼표로 구분)", key: "tags" },
            ].map(({ label, key }) => (
              <div key={key} style={{ marginBottom: 12 }}>
                <div style={{ fontSize: 12, color: "#6b7280", marginBottom: 4 }}>{label}</div>
                <input value={editForm[key] || ""} onChange={e => setEditForm(f => ({ ...f, [key]: e.target.value }))}
                  style={{ ...s.input, width: "100%", boxSizing: "border-box" }} />
              </div>
            ))}
            <div style={{ marginBottom: 16 }}>
              <div style={{ fontSize: 12, color: "#6b7280", marginBottom: 4 }}>컬렉션</div>
              <select value={editForm.collection_id || ""} onChange={e => setEditForm(f => ({ ...f, collection_id: e.target.value }))}
                style={{ ...s.input, width: "100%", boxSizing: "border-box" }}>
                <option value="">미분류</option>
                {collections.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select>
            </div>
            <div style={{ display: "flex", gap: 8, justifyContent: "flex-end" }}>
              <button onClick={() => setEditingBookmark(null)} style={s.btn()}>취소</button>
              <button onClick={saveEdit} disabled={saving} style={{ ...s.btn("primary"), opacity: saving ? 0.6 : 1 }}>
                {saving ? "저장 중..." : "저장"}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<StashManager />);
</script>
</body>
</html>
