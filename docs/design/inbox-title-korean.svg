<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="860" viewBox="0 0 1040 860" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#208aef"/>
      <stop offset="1" stop-color="#0f5ea8"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#101828" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1040" height="860" fill="#eef2f8"/>
  <text x="40" y="56" font-size="26" font-weight="800" fill="#101828" letter-spacing="-0.5">Bilingual lockup — Stash + 스태시</text>
  <text x="40" y="86" font-size="15" fill="#667085">Korean wordmark set smaller &amp; lighter · Noto Sans KR · real palette</text>

  <!-- A. INLINE, BASELINE, SECONDARY -->
  <g transform="translate(40,120)">
    <rect width="460" height="300" rx="22" fill="#f7f9fc" stroke="#e6eaf0" filter="url(#cardShadow)"/>
    <text x="28" y="40" font-size="13" font-weight="700" fill="#208aef" letter-spacing="1">A · INLINE · BASELINE</text>
    <text x="28" y="150" font-size="56" font-weight="800" fill="#101828" letter-spacing="-2">Stash<tspan font-family="'Noto Sans KR'" font-weight="400" font-size="26" fill="#667085" letter-spacing="0" dx="14">스태시</tspan></text>
    <text x="28" y="190" font-size="20" fill="#667085">Save now. Organize later.</text>
    <text x="28" y="226" font-size="17" font-weight="600" fill="#667085">12 saved</text>
  </g>

  <!-- B. INLINE, ACCENT -->
  <g transform="translate(540,120)">
    <rect width="460" height="300" rx="22" fill="#f7f9fc" stroke="#e6eaf0" filter="url(#cardShadow)"/>
    <text x="28" y="40" font-size="13" font-weight="700" fill="#208aef" letter-spacing="1">B · INLINE · ACCENT</text>
    <text x="28" y="150" font-size="56" font-weight="800" fill="#101828" letter-spacing="-2">Stash<tspan font-family="'Noto Sans KR'" font-weight="500" font-size="26" fill="#208aef" letter-spacing="0" dx="14">스태시</tspan></text>
    <text x="28" y="190" font-size="20" fill="#667085">Save now. Organize later.</text>
    <text x="28" y="226" font-size="17" font-weight="600" fill="#667085">12 saved</text>
  </g>

  <!-- C. DIVIDER -->
  <g transform="translate(40,460)">
    <rect width="460" height="300" rx="22" fill="#f7f9fc" stroke="#e6eaf0" filter="url(#cardShadow)"/>
    <text x="28" y="40" font-size="13" font-weight="700" fill="#208aef" letter-spacing="1">C · THIN DIVIDER</text>
    <text x="28" y="150" font-size="56" font-weight="800" fill="#101828" letter-spacing="-2">Stash</text>
    <rect x="210" y="112" width="2" height="34" rx="1" fill="#e6eaf0"/>
    <text x="226" y="146" font-family="'Noto Sans KR'" font-weight="400" font-size="25" fill="#667085">스태시</text>
    <text x="28" y="190" font-size="20" fill="#667085">Save now. Organize later.</text>
    <text x="28" y="226" font-size="17" font-weight="600" fill="#667085">12 saved</text>
  </g>

  <!-- D. STACKED -->
  <g transform="translate(540,460)">
    <rect width="460" height="300" rx="22" fill="#f7f9fc" stroke="#e6eaf0" filter="url(#cardShadow)"/>
    <text x="28" y="40" font-size="13" font-weight="700" fill="#208aef" letter-spacing="1">D · STACKED (kicker)</text>
    <text x="28" y="98" font-family="'Noto Sans KR'" font-weight="500" font-size="20" fill="#208aef" letter-spacing="2">스태시</text>
    <text x="28" y="156" font-size="54" font-weight="800" fill="#101828" letter-spacing="-2">Stash</text>
    <text x="28" y="196" font-size="20" fill="#667085">Save now. Organize later.</text>
    <text x="28" y="232" font-size="17" font-weight="600" fill="#667085">12 saved</text>
  </g>
</svg>
