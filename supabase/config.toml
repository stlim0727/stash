# Supabase project config (CLI + GitHub integration).
# The GitHub integration deploys the migrations under supabase/migrations/ to
# the linked project when changes land on the production branch. `project_id`
# is just a local identifier (defaults to the directory name); the actual
# remote project is determined by the dashboard link / `supabase link`.
project_id = "stash"

[db]
# Postgres major version used for local dev (`supabase start`).
major_version = 15

[auth]
# Stash is anonymous-first: the app creates an anonymous session on first launch.
enable_anonymous_sign_ins = true

[functions.ai-enrich]
# The function authorizes via the caller's forwarded JWT + RLS (it holds no
# service-role key). The gateway must therefore NOT pre-verify the JWT, or it
# rejects the app's anonymous-session tokens with 401 "Invalid JWT" before the
# function runs. Authorization is still enforced — by RLS on the forwarded
# token, and a missing token is rejected in the handler.
verify_jwt = false
