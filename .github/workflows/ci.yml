name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:components
      # The logic lane writes a rendered SVG preview of the tag cloud; publish it
      # so the layout can be eyeballed without the Android emulator job.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tag-cloud-preview
          path: apps/mobile/.artifacts/*.svg
          if-no-files-found: warn
