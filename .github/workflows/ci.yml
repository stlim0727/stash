name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:components
      # Guard the web target: the static export must keep building so a change
      # can't silently break web (the /add capture route, the PWA manifest, the
      # web-only Settings section). Headless — no emulator needed. dist/ is
      # gitignored and discarded with the ephemeral runner.
      - name: Web export builds
        run: cd apps/mobile && CI=1 pnpm exec expo export --platform web
      # The logic lane writes a rendered SVG preview of the tag cloud; rasterize
      # it to PNG (system librsvg, no repo dependency) and publish both so the
      # layout can be eyeballed without the Android emulator job.
      - name: Rasterize tag-cloud preview to PNG
        if: always()
        # Never fail the build over the preview: it's a nice-to-have artifact.
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          if [ -f apps/mobile/.artifacts/tag-cloud-example.svg ]; then
            rsvg-convert -w 1520 apps/mobile/.artifacts/tag-cloud-example.svg \
              -o apps/mobile/.artifacts/tag-cloud-example.png
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        # The preview is decorative (a deterministic tag-cloud render). Never let
        # its upload fail the gate — e.g. when the account's artifact storage
        # quota is hit, CreateArtifact errors hard, which would otherwise sink
        # every PR's checks. Short retention so it can't pile onto that quota.
        continue-on-error: true
        with:
          name: tag-cloud-preview
          path: |
            apps/mobile/.artifacts/tag-cloud-example.png
            apps/mobile/.artifacts/tag-cloud-example.svg
          # .artifacts is a dotted (hidden) dir; v4 skips hidden files otherwise.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
