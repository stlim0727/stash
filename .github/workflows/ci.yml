name: CI

# Runs the same lint/typecheck/test gate as .circleci/config.yml's `ci`
# workflow. Restored after CircleCI's plan ran out of credits, so PRs can
# still get a real CI signal on GitHub Actions while CircleCI is unavailable.
# Gated by the CI_PROVIDER repo variable (Settings -> Secrets and variables ->
# Actions -> Variables) so only one provider actually runs the gate at a time
# instead of burning both CircleCI credits and Actions minutes on every push:
#   CI_PROVIDER = github   -> this job runs, CircleCI's checks job is the
#                             redundant one (still triggers, but harmless)
#   unset / anything else  -> this job is skipped (no runner allocated, no
#                             minutes billed); CircleCI is the active gate
# Keep both configs' steps in sync if the gate changes.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    if: vars.CI_PROVIDER == 'github'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:components
      # Guard the web target: the static export must keep building so a change
      # can't silently break web (the /add capture route, the PWA manifest, the
      # web-only Settings section). Headless — no emulator needed. dist/ is
      # gitignored and discarded with the ephemeral runner.
      - name: Web export builds
        run: cd apps/mobile && CI=1 pnpm exec expo export --platform web
      - name: Browser verifies web security policy
        run: node scripts/verify-web-security.mjs apps/mobile/dist
      # The logic lane writes a rendered SVG preview of the tag cloud; rasterize
      # it to PNG (system librsvg, no repo dependency) and publish both so the
      # layout can be eyeballed without the Android emulator job.
      - name: Rasterize tag-cloud preview to PNG
        if: always()
        # Never fail the build over the preview: it's a nice-to-have artifact.
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y librsvg2-bin
          if [ -f apps/mobile/.artifacts/tag-cloud-example.svg ]; then
            rsvg-convert -w 1520 apps/mobile/.artifacts/tag-cloud-example.svg \
              -o apps/mobile/.artifacts/tag-cloud-example.png
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        # The preview is decorative (a deterministic tag-cloud render). Never let
        # its upload fail the gate — e.g. when the account's artifact storage
        # quota is hit, CreateArtifact errors hard, which would otherwise sink
        # every PR's checks. Short retention so it can't pile onto that quota.
        continue-on-error: true
        with:
          name: tag-cloud-preview
          path: |
            apps/mobile/.artifacts/tag-cloud-example.png
            apps/mobile/.artifacts/tag-cloud-example.svg
          # .artifacts is a dotted (hidden) dir; v4 skips hidden files otherwise.
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 7
