name: Android APK

# Builds a standalone, installable Android APK in CI (no EAS account needed):
# expo prebuild → Gradle assembleRelease. The RN/Expo template signs the
# `release` build type with the debug keystore and bundles the JS, so the APK
# installs and runs on a device on its own.
#
# Every build publishes a GitHub Release with the raw .apk + an install QR code
# (download the Release asset — no artifact zip to unpack):
# - clean `vX.Y.Z` (pushed tag or dispatch input): a versioned prerelease.
# - blank dispatch or a hyphenated tag (e.g. v0.1.0-test1): refreshes the single
#   rolling `dev` prerelease in place, so test builds don't clutter Releases.
#   A blank dispatch no longer builds an unlabeled snapshot: the "Determine
#   build version" step computes the next `vX.Y.Z-rcN` itself — same target
#   version (apps/mobile/app.json) as the last `dev` build bumps only the rc
#   number, a new target version bumps to that version's rc1.
# The APK is also uploaded as a run artifact for tooling that consumes it.
#
# Optional build-time config via repo secrets (absent ⇒ local-only build):
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_SENTRY_DSN,
#   EXPO_PUBLIC_POSTHOG_API_KEY, EXPO_PUBLIC_POSTHOG_HOST, EXPO_PUBLIC_POSTHOG_FULL_SDK_ENABLED

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish a Release at (e.g. v0.1.0). Blank = auto-computed next rc.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

# Serialize runs that share mutable state: the smart version-allocation step
# reads the rolling `dev` release before this run publishes its own update, and
# the publish steps force-move the shared `dev` tag/release. Two overlapping
# dev-targeted runs (blank dispatch or any hyphenated version) would both read
# the same "last rc" state and allocate the same next number, then race to
# publish — whichever finishes last silently wins and the other's rc label is
# reused for a different APK. `cancel-in-progress: false` queues the second run
# instead of racing or killing it. Scoped to `android-apk-dev` rather than one
# repo-wide group: GitHub Actions keeps at most one *pending* run per
# concurrency group and a newly queued run replaces (drops) an older pending
# one in the same group, even with cancel-in-progress: false — so a clean
# vX.Y.Z build (its own versioned release/tag, no shared state) gets its own
# per-version group and is never at risk of being silently dropped behind a
# queue of dev builds.
# A dispatch input that isn't a clean `vX.Y.Z` — including one that doesn't
# even start with `v` (e.g. a typo'd "1.2.3") — is NOT treated as a stable
# release by "Determine release target" below (it requires `LABEL == v*`);
# it falls through to the shared rolling `dev` build instead. The group
# predicate here mirrors that exactly (startsWith 'v' + no hyphen) so such an
# input can't wrongly get an isolated per-version group while actually
# targeting — and racing over — the shared dev release.
concurrency:
  group: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-') && format('android-apk-stable-{0}', github.ref_name)) || (github.event_name == 'workflow_dispatch' && startsWith(inputs.version, 'v') && !contains(inputs.version, '-') && format('android-apk-stable-{0}', inputs.version)) || 'android-apk-dev' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # A hoisted (npm-like) layout is friendliest for React Native Gradle
      # autolinking; pnpm's default isolated symlinks can confuse it.
      - name: Install dependencies (hoisted)
        run: |
          echo "node-linker=hoisted" >> .npmrc
          pnpm install --no-frozen-lockfile

      # Restore Gradle deps/transforms + local build cache. Split into restore +
      # save so the cache is always updated after each build — actions/cache@v4
      # skips saving on a cache hit, which means the Gradle build cache (task
      # output hashes) never grows beyond the first cold build for a given
      # dependency set. Saving unconditionally lets native task outputs accumulate
      # run-over-run so each build only recompiles what actually changed.
      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Cache the C++ compiler outputs (ccache). `expo prebuild` regenerates the
      # android/ dir each run, so the NDK build can't be cached in-tree — but
      # ccache lives outside it and turns the slow reanimated/folly/fabric
      # recompiles into cache hits on subsequent builds.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      # Make sure the ccache binary is present (the runner image usually ships
      # it, but don't depend on that) and zero its run stats so the post-build
      # `ccache -s` reflects only this build's hit/miss rate.
      - name: Install ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          ccache --version | head -1
          ccache -z

      # Metro transform cache: Metro (the JS bundler) caches per-file transform
      # results in /tmp/metro-*. Without this, every run re-transforms all
      # source files even though most haven't changed. Restoring it lets Metro
      # skip unchanged files and only re-transform what's new, cutting the
      # bundleReleaseJsAndAssets Gradle task from ~9 min back toward ~5 min.
      - name: Restore Metro cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/metro-*
          key: metro-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            metro-${{ runner.os }}-

      # A blank workflow_dispatch (no `version` input) used to fall back to
      # app.json's bare version with no `-rcN`, so the build carried no RC
      # label and `docs/development/build-history.md` couldn't self-derive the
      # next number from it. Compute a smart default instead: same target
      # version (`apps/mobile/app.json`) as the last `dev` build ⇒ bump only
      # the rc number; app.json has already moved to a new target (or no prior
      # `dev` build exists) ⇒ that's a new cycle, start at rc1. An explicit
      # `version` input always wins, unchanged.
      - name: Determine build version
        id: version
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # Resolve the target version from `main` specifically, not
          # whatever ref this dispatch happens to be running against — RCs
          # always ship from main (per the rc-build skill), so a blank or
          # explicit dispatch made against an old branch must not read that
          # branch's app.json and cross-contaminate the current rc cycle.
          git fetch origin main --quiet
          APP_VERSION=$(git show FETCH_HEAD:apps/mobile/app.json | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).expo.version)")
          APP_VERSION_RE=$(printf '%s' "$APP_VERSION" | sed 's/\./\\./g')

          # Reading app.json from main isn't enough on its own: actions/
          # checkout still built whatever ref this dispatch actually
          # selected, so a blank or current-cycle-rc dispatch made against an
          # old/feature branch would label that branch's code as the next
          # main rc and ship it through the shared dev release/Firebase.
          # Require the dispatch itself to be on main for these two cases
          # (an explicit off-cycle or non-rc dispatch is unaffected — it
          # doesn't touch the main-tracked cycle at all, e.g. a release
          # branch's own test build).
          IS_MAIN_CYCLE_RC=false
          if [ -z "$INPUT_VERSION" ] || [[ "$INPUT_VERSION" =~ ^v${APP_VERSION_RE}-rc[0-9]+$ ]]; then
            IS_MAIN_CYCLE_RC=true
          fi
          if [ "$IS_MAIN_CYCLE_RC" = "true" ] && [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::A blank or current-cycle RC dispatch must run from main (this run is on '${{ github.ref_name }}') — RCs always ship from main. Dispatch from main, or pass an explicit off-cycle version if you intend to build a different ref/line."
            exit 1
          fi

          # Fetch the dev release once — used both to validate an explicit
          # RC input below and to smart-compute the next one when blank.
          # A 404 (no `dev` release exists yet) genuinely means "first build
          # ever" and is safe to treat as empty. Any other failure (transient
          # 403/5xx, network) must NOT be swallowed the same way — silently
          # treating an outage as "no prior build" would reset an in-progress
          # rc cycle back to rc1 and reuse an already-built label, so fail
          # the run instead and let it be retried.
          if DEV_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/dev" 2>/tmp/gh-dev-err.log); then
            :
          elif grep -q '404' /tmp/gh-dev-err.log; then
            echo "No dev release exists yet (404) — first build."
            DEV_JSON='{}'
          else
            echo "::error::Failed to look up the dev release for rc allocation (not a 404 — refusing to silently reset the rc counter):"
            cat /tmp/gh-dev-err.log
            exit 1
          fi
          DEV_BODY=$(echo "$DEV_JSON" | jq -r '.body // ""')

          # The rolling `dev` prerelease's *name* reflects whatever build was
          # dispatched last, including a manual non-rc hyphenated test build
          # (e.g. `v1.2.3-test1`) — reading that back would lose the real rc
          # count. Read the hidden `rc-state` marker from the release *body*
          # instead, which "Compose release notes" only ever advances for an
          # actual rc build and otherwise carries forward unchanged, so a test
          # build in between can't regress the next rc number. Every `dev`
          # publish has written this marker since it was introduced (#302), so
          # an empty result here means a genuinely markerless dev release (a
          # fresh `dev`, or one deleted/edited by hand) — treated as "no prior
          # build" below, same as a 404.
          LAST_LABEL=$(echo "$DEV_BODY" | grep -oE 'rc-state: v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+' | head -1 | sed 's/rc-state: //' || true)
          LAST_BASE="${LAST_LABEL%-rc*}"
          LAST_RC="${LAST_LABEL##*-rc}"

          # Computed here (not only in the blank-dispatch path below) so the
          # explicit-input branch can also recognize "I already published
          # this myself" — see the rerun check just below. GitHub run_ids
          # are monotonically increasing across the whole instance.
          DEV_RUN_ID=$(echo "$DEV_BODY" | grep -oE 'run-id: [0-9]+' | head -1 | sed 's/run-id: //' || true)

          if [ -n "$INPUT_VERSION" ]; then
            # Concurrency serializes overlapping runs but doesn't stop two
            # operators from each precomputing the same explicit rc *before*
            # either publishes, then queueing both: the second one to
            # acquire the lock would otherwise blindly publish its
            # operator's stale number over what the first already shipped.
            # Only revalidate the risky shape — an explicit rc for the
            # *current* app.json cycle — since that's the only case hidden
            # allocator state can actually collide with. Exempt a rerun of
            # THIS run's own successful publish (e.g. it failed later in
            # Firebase distribution): its own marker will show LAST_RC ==
            # INPUT_RC with our own run-id, which must retry cleanly rather
            # than being rejected as "stale".
            if [[ "$INPUT_VERSION" =~ ^v${APP_VERSION_RE}-rc[0-9]+$ ]] && [ "$DEV_RUN_ID" != "$GITHUB_RUN_ID" ]; then
              INPUT_RC="${INPUT_VERSION##*-rc}"
              if [ -n "$LAST_RC" ] && [ "${LAST_BASE#v}" = "$APP_VERSION" ] && [ "$LAST_RC" -ge "$INPUT_RC" ]; then
                echo "::error::Explicit version $INPUT_VERSION is stale — dev has already reached rc$LAST_RC for $APP_VERSION. Re-check the current state (or leave version blank to let the workflow allocate the next number)."
                exit 1
              fi
            fi
            echo "Using explicit version input: $INPUT_VERSION"
            echo "version=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A rerun of a failed job (e.g. the Firebase distribution step
          # failed) re-executes this step too — checked unconditionally
          # (not gated behind a local cache hit, which a rerun can't always
          # rely on: evicted, or a cache-service hiccup on this fresh
          # runner) via the hidden run-id marker "Compose release notes"
          # stamps on every dev publish.
          if [ "$DEV_RUN_ID" = "$GITHUB_RUN_ID" ]; then
            # This run (any attempt) already published dev's current rc —
            # reuse it verbatim. Recomputing would read our own already-
            # advanced marker and draw a second rc for the same commit.
            echo "Reusing version this run already published: $LAST_LABEL"
            echo "version=$LAST_LABEL" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ -n "$DEV_RUN_ID" ] && [ "$DEV_RUN_ID" -gt "$GITHUB_RUN_ID" ]; then
            # Concurrency only serializes overlapping runs, not a rerun of
            # one that already finished: a numerically later run_id means a
            # *different*, later run already published since this one
            # started — proceeding would republish older/lower-versionCode
            # code under a fresh, higher-looking rc label.
            echo "::error::A different, later run (run-id $DEV_RUN_ID) already published to the dev release since this run started — this run is stale. Dispatch a fresh build instead of rerunning it."
            exit 1
          fi

          if [ -n "$LAST_RC" ] && [ "${LAST_BASE#v}" = "$APP_VERSION" ]; then
            # `10#` forces base-10: a zero-padded rc (e.g. rc020, from a
            # manually typed explicit label the marker then carried forward)
            # would otherwise be misread as octal by `$(( ))`.
            NEXT="v${APP_VERSION}-rc$((10#$LAST_RC + 1))"
          else
            NEXT="v${APP_VERSION}-rc1"
          fi

          echo "Last dev build: ${LAST_LABEL:-<none>}; app.json target: $APP_VERSION -> computed $NEXT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Prebuild Android project
        working-directory: apps/mobile
        # app.config.js stamps these onto the native project: APP_VERSION (from
        # the release tag, leading `v` stripped in the config; on a blank
        # dispatch this is now the smart-computed version above, not a raw
        # app.json fallback) and a per-run versionCode so every App
        # Distribution upload is unique and increasing. The GIT_* provenance is
        # stamped into the config's `extra` here too so the embedded
        # Constants.expoConfig.extra carries the right commit (see app.config.js).
        env:
          APP_VERSION: ${{ steps.version.outputs.version || (github.event_name == 'push' && github.ref_name) || '' }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_GIT_REF: ${{ github.ref_name }}
          EXPO_PUBLIC_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_GOOGLE_SERVICES_BASE64: ${{ secrets.EXPO_PUBLIC_GOOGLE_SERVICES_BASE64 }}
        run: npx expo prebuild --platform android --no-install

      - name: Give Gradle more heap
        working-directory: apps/mobile/android
        # Leading/trailing newlines so this lands on its own line even if the
        # generated gradle.properties has no trailing newline (a later duplicate
        # key overrides the template's value).
        # org.gradle.caching enables the local build cache (persisted via the
        # ~/.gradle cache above), so unchanged module compiles are reused.
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\norg.gradle.caching=true\n' >> gradle.properties

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          # Release APKs report under the "production" Sentry environment (the
          # SDK otherwise defaults to "development").
          EXPO_PUBLIC_SENTRY_ENVIRONMENT: production
          # PostHog (both the base hand-rolled analytics client and the full
          # SDK trial). Absent secrets ⇒ both stay no-ops, same pattern as
          # Sentry above.
          EXPO_PUBLIC_POSTHOG_API_KEY: ${{ secrets.EXPO_PUBLIC_POSTHOG_API_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ secrets.EXPO_PUBLIC_POSTHOG_HOST }}
          EXPO_PUBLIC_POSTHOG_FULL_SDK_ENABLED: ${{ secrets.EXPO_PUBLIC_POSTHOG_FULL_SDK_ENABLED }}
          # Build provenance — stamped into the config's `extra` (read at runtime
          # via Constants.expoConfig.extra) and shown in Settings so any installed
          # APK self-identifies which commit it was built from. NOT inlined into
          # the JS bundle: that path freezes in Metro's transform cache and
          # reports a stale commit (see app.config.js / domain/build-info.ts).
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_GIT_REF: ${{ github.ref_name }}
          EXPO_PUBLIC_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          # Same version inputs as prebuild, so the JS bundle's
          # Constants.expoConfig.version (shown in Settings) matches the native
          # versionName/versionCode baked into the APK.
          APP_VERSION: ${{ steps.version.outputs.version || (github.event_name == 'push' && github.ref_name) || '' }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_GOOGLE_SERVICES_BASE64: ${{ secrets.EXPO_PUBLIC_GOOGLE_SERVICES_BASE64 }}
          # Route every CMake/NDK C++ compile through ccache. React Native only
          # wires ccache when building RN *itself* from source; for a prebuilt-RN
          # app build — and for third-party native modules (reanimated, worklets,
          # expo-modules-core, folly/fabric) — USE_CCACHE was a no-op, so those
          # compiles (the single biggest chunk of the build, ~4-5 min) ran cold
          # every run and the ccache dir stayed empty. CMake initializes the
          # CMAKE_<LANG>_COMPILER_LAUNCHER cache variable from the env var of the
          # same name, so exporting these makes every module use ccache as its
          # compiler launcher — independent of RN/Expo internals.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 3G
          # expo prebuild regenerates android/ each run, so the absolute paths in
          # the compile commands shift run-over-run; CCACHE_BASEDIR rewrites them
          # to relative paths so cached objects still hit. The sloppiness flags
          # stop __DATE__/__TIME__ and include mtimes from busting the cache.
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          # NOHASHDIR drops the build dir (cwd) from the hash — Gradle/NDK compile
          # each module from a per-run .cxx/<hash> dir, so without it the same
          # source missed run-over-run (first warm build hit only ~29%). It only
          # affects debug-symbol paths, irrelevant for an internal APK. `locale`
          # ignores LC_* so a runner locale change can't bust the cache.
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,locale
        # Build only the arm64-v8a ABI — every modern Android phone — to keep
        # the cold-cache native (NDK) compile fast and the APK small.
        # `-x lintVitalRelease` skips AGP's release-lint chain (lintVitalAnalyze/
        # generateReleaseLintVital*), which assembleRelease runs by default and
        # which cost ~2 min — pure overhead for an internal, debug-signed APK.
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --build-cache -PreactNativeArchitectures=arm64-v8a -x lintVitalRelease

      # Surface ccache's hit/miss for this build so a regression (back to 0%
      # hits) is visible in the log instead of silently costing 5 cold minutes.
      - name: ccache stats
        if: always()
        run: ccache -s

      # Always save the Gradle cache after each build so the Gradle build cache
      # (task output hashes stored in ~/.gradle/caches/build-cache-*) accumulates
      # run-over-run. Key by sha so every run creates a fresh entry; the restore
      # step above falls back via prefix match to pick up the most recent one.
      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}

      # Always save Metro's transform cache after the build so the next run can
      # skip re-transforming files that haven't changed. Key by sha (unique per
      # commit); restore above uses prefix fallback to the most recent entry.
      - name: Save Metro cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/metro-*
          key: metro-${{ runner.os }}-${{ github.sha }}

      # Decide where this build is published. A clean vX.Y.Z (pushed tag or
      # dispatch input) is a real, versioned prerelease kept forever. Anything
      # else — a blank dispatch or a hyphenated pre-release tag — refreshes a
      # single rolling `dev` prerelease in place (stable tag + filename), so the
      # Releases list stays tidy instead of growing one entry per test build.
      - name: Determine release target
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          LABEL=""
          if [ -n "${{ steps.version.outputs.version }}" ]; then
            LABEL="${{ steps.version.outputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            LABEL="${{ github.ref_name }}"
          fi
          if [[ "$LABEL" == v* && "$LABEL" != *-* ]]; then
            TAG="$LABEL"
            APK="stash-${LABEL}-${SHA_SHORT}-android.apk"
            REL_NAME="Stash $LABEL"
            # A clean vX.Y.Z is a real, stable release: mark it latest, not a prerelease.
            PRERELEASE="false"
            MAKE_LATEST="true"
          else
            TAG="dev"
            APK="stash-dev-android.apk"
            # Carry the -rcN label (the dispatch's `version` input) into the
            # rolling dev release name so the release itself self-records which
            # RC it is. Without this the label is dropped and the rc number has
            # to be re-recorded by hand (a per-build docs PR to build-history.md);
            # stamping it here makes "what's the next rc?" answerable from the
            # live `dev` release, no ledger PR required. Blank dispatch ⇒ no label.
            if [ -n "$LABEL" ]; then
              REL_NAME="Development build — $LABEL (latest)"
            else
              REL_NAME="Development build (latest)"
            fi
            # Rolling dev / hyphenated test builds stay prereleases and never "latest".
            PRERELEASE="true"
            MAKE_LATEST="false"
          fi
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/${APK}"
          {
            echo "tag=$TAG"
            echo "label=$LABEL"
            echo "apk=$APK"
            echo "rel_name=$REL_NAME"
            echo "sha_short=$SHA_SHORT"
            echo "url=$URL"
            echo "prerelease=$PRERELEASE"
            echo "make_latest=$MAKE_LATEST"
          } >> "$GITHUB_OUTPUT"

      - name: Stage the APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "dist/${{ steps.meta.outputs.apk }}"
          ls -la dist

      # When Supabase is configured, verify Expo actually inlined the URL into
      # the release bundle. Catches the "dynamic process.env reads empty in
      # production" class of bug that unit tests can't see.
      - name: Assert EXPO_PUBLIC_SUPABASE_URL inlined (when configured)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "No Supabase URL secret — local-only build; skipping inline assertion."
            exit 0
          fi
          APK=$(ls dist/stash-*-android.apk | head -1)
          rm -rf /tmp/apkassets && unzip -o -q "$APK" 'assets/*' -d /tmp/apkassets || true
          BUNDLE=$(find /tmp/apkassets -name '*.bundle' | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::warning::No JS bundle found in the APK to verify; skipping."
            exit 0
          fi
          if grep -aqF ".supabase.co" "$BUNDLE"; then
            echo "✓ Supabase URL inlined into the release bundle."
          else
            echo "::error::EXPO_PUBLIC_SUPABASE_URL was set but '.supabase.co' is absent from the release bundle — Expo did not inline it (likely dynamic process.env access)."
            exit 1
          fi

      # No Actions-artifact copy of the APK: the same ~80 MB binary is attached
      # to the GitHub Release (durable) and pushed to Firebase App Distribution,
      # so an artifact copy is pure redundancy — and on a private repo each one
      # counts against the account's 500 MB (Free) artifact quota, which an
      # ~80 MB APK per build exhausts fast (it started failing CreateArtifact and
      # sinking unrelated PRs). Download the APK from the Release/Firebase instead.

      # Encode the direct Release download URL as a QR code, attached to the
      # Release and embedded in its notes. Scanning it on a phone goes straight
      # to the .apk — no desktop, no artifact zip to unpack.
      - name: Generate install QR code
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode
          qrencode -o dist/install-qr.png -s 8 -m 2 "${{ steps.meta.outputs.url }}"
          ls -la dist

      # Compose the release body. For a versioned release, lead with the
      # human-written notes at docs/release-notes/<tag>.md (if present) so the
      # Release reads as a real changelog; the install/QR section is always
      # appended. The rolling `dev` build keeps just the install section, but
      # also checks if a release note file for its specific version label
      # (e.g. docs/release-notes/v1.2.0-rc1.md) exists and includes it.
      - name: Compose release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=dist/RELEASE_BODY.md
          NOTES="docs/release-notes/${{ steps.meta.outputs.tag }}.md"
          LABEL_NOTES="docs/release-notes/${{ steps.meta.outputs.label }}.md"
          : > "$BODY"

          # Hidden rc-state marker (dev release only, invisible in rendered
          # markdown): carries the last actual rc build's label forward across
          # a non-rc hyphenated test dispatch (e.g. v1.2.3-test1), so
          # "Determine build version" can always find the true last rc even
          # when the most recent dev build itself wasn't one. Always read the
          # existing marker first — needed both to preserve it when this
          # build isn't a legitimate advance, and to guard against THIS
          # build's own label moving the tracked state *backward*: an
          # explicit RC for a different/older line (`v1.2.2-rc9` while the
          # marker tracks `1.2.3`), or a same-version but lower/duplicate rc
          # number (an explicit rebuild or typo of an already-superseded rc,
          # e.g. `v1.2.3-rc5` after the marker already reached `v1.2.3-rc19`)
          # must NOT clobber a higher, already-issued number.
          if [ "${{ steps.meta.outputs.tag }}" = "dev" ]; then
            THIS_LABEL="${{ steps.meta.outputs.label }}"
            # Read from `main`, not whatever ref this build happens to be
            # from — the current rc cycle is tracked against main's
            # app.json regardless of which ref actually built (see
            # "Determine build version" for the matching read).
            git fetch origin main --quiet
            APP_VERSION=$(git show FETCH_HEAD:apps/mobile/app.json | node -e "console.log(JSON.parse(require('fs').readFileSync(0,'utf8')).expo.version)")

            # This build is about to overwrite the dev release, so a
            # swallowed lookup failure here would permanently drop the
            # marker (not just skip a read like in "Determine build
            # version"). A 404 is a genuinely markerless dev release (fine,
            # nothing to carry forward); anything else must fail loudly
            # rather than silently publish over the last known rc state.
            if OLD_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/dev" 2>/tmp/gh-dev-err.log); then
              OLD_BODY=$(echo "$OLD_JSON" | jq -r '.body // ""')
            elif grep -q '404' /tmp/gh-dev-err.log; then
              OLD_BODY=""
            else
              echo "::error::Failed to look up the existing dev release before publishing over it (not a 404 — refusing to silently drop the rc-state marker):"
              cat /tmp/gh-dev-err.log
              exit 1
            fi
            # Every `dev` publish has written this marker since it was
            # introduced (#302), so an empty result here means a genuinely
            # markerless dev release (fresh, or deleted/edited by hand) — the
            # checks below treat that the same as "no prior rc for this line."
            OLD_MARKER=$(echo "$OLD_BODY" | grep -oE 'rc-state: v[0-9]+\.[0-9]+\.[0-9]+-rc[0-9]+' | head -1 | sed 's/rc-state: //' || true)

            RC_MARKER="$OLD_MARKER"
            # An exact, fully-numeric match — the glob `-rc[0-9]*` would also
            # accept a label like `v1.2.3-rc1-test`, since the trailing `*`
            # matches any remaining characters, wrongly treating a test build
            # as a real "rc1" advance.
            APP_VERSION_RE=$(printf '%s' "$APP_VERSION" | sed 's/\./\\./g')
            if [[ "$THIS_LABEL" =~ ^v${APP_VERSION_RE}-rc[0-9]+$ ]]; then
              THIS_RC="${THIS_LABEL##*-rc}"
              OLD_BASE="${OLD_MARKER%-rc*}"
              OLD_RC="${OLD_MARKER##*-rc}"
              if [ -z "$OLD_MARKER" ] || [ "${OLD_BASE#v}" != "$APP_VERSION" ] || [ "$THIS_RC" -gt "$OLD_RC" ]; then
                RC_MARKER="$THIS_LABEL"
              fi
            fi

            if [ -n "$RC_MARKER" ]; then
              echo "<!-- rc-state: $RC_MARKER -->" >> "$BODY"
            fi

            # Hidden run-id marker: records which workflow run last published
            # to dev. "Determine build version" uses this, not the commit
            # sha, to tell "this exact run already published" from "a
            # different run published the same commit" and from "a later
            # run has since superseded this one" — which only holds if the
            # marker itself never moves backward. GitHub run_ids are
            # monotonically increasing, so a rerun of an *older*, non-rc or
            # off-cycle dev build (which bypasses the rc-state guard above
            # entirely) must not overwrite a genuinely later run's id;
            # keep whichever is greater.
            OLD_RUN_ID=$(echo "$OLD_BODY" | grep -oE 'run-id: [0-9]+' | head -1 | sed 's/run-id: //' || true)
            NEW_RUN_ID="${{ github.run_id }}"
            if [ -n "$OLD_RUN_ID" ] && [ "$OLD_RUN_ID" -gt "$NEW_RUN_ID" ]; then
              NEW_RUN_ID="$OLD_RUN_ID"
            fi
            echo "<!-- run-id: $NEW_RUN_ID -->" >> "$BODY"
          fi

          if [ -f "$NOTES" ]; then
            cat "$NOTES" >> "$BODY"
            printf '\n\n---\n\n' >> "$BODY"
          elif [ -n "${{ steps.meta.outputs.label }}" ] && [ -f "$LABEL_NOTES" ]; then
            cat "$LABEL_NOTES" >> "$BODY"
            printf '\n\n---\n\n' >> "$BODY"
          fi
          cat >> "$BODY" <<EOF
          Standalone debug-signed Android APK built in CI.

          **Build** ${{ steps.meta.outputs.label && format('\`{0}\` · ', steps.meta.outputs.label) }}[\`${{ steps.meta.outputs.sha_short }}\`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) · \`${{ github.ref_name }}\`

          ### 📲 Install on Android
          Scan this on your phone (or open the link), then tap the downloaded
          \`.apk\` to install. The first time, allow "install unknown apps" for
          your browser when prompted.

          ![Install QR](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/install-qr.png)

          ➡️ **[Download ${{ steps.meta.outputs.apk }}](${{ steps.meta.outputs.url }})**

          Local-only unless the repo's \`EXPO_PUBLIC_SUPABASE_*\` secrets were set
          at build time.
          EOF
          echo "----- release body -----"; cat "$BODY"

      # The rolling `dev` tag is reused across builds. softprops updates the
      # release + assets but won't move an existing tag (`target_commitish` is
      # ignored once the tag exists), so force-point `dev` at this commit first —
      # otherwise the tag and its source archives stay on the first dev build
      # while the APK/body are from this one. Versioned tags are new each build,
      # so they don't need this. `dev` doesn't match the `v*` push trigger, so
      # this doesn't re-trigger the workflow. Runs *after* "Compose release
      # notes" (which reads the dev release's current state and can fail on a
      # transient lookup error) so a failure there aborts before the tag moves,
      # instead of leaving the tag repointed at a build whose release/APK
      # never actually got published.
      - name: Repoint rolling dev tag at this commit
        if: ${{ steps.meta.outputs.tag == 'dev' }}
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push -f origin "refs/tags/dev"

      # Every build now publishes a Release with the raw .apk + QR. A clean
      # vX.Y.Z is a stable, "latest" release; everything else refreshes the
      # rolling `dev` prerelease in place. The action creates/updates the tag at
      # this commit, so no tag has to be pushed from a constrained environment.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.make_latest }}
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.rel_name }}
          files: |
            dist/*.apk
            dist/install-qr.png
          body_path: dist/RELEASE_BODY.md

      # Distribute to testers via Firebase App Distribution when configured.
      # Testers install through the "App Tester" app: no per-build unknown-sources
      # toggle, and each build pushes a notification. Skips cleanly when the
      # secrets are absent, so the workflow still runs without Firebase set up.
      # Setup: docs/development/releasing.md → "Firebase App Distribution".
      - name: Distribute to Firebase App Distribution (when configured)
        id: firebase-distribute
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Comma-separated Firebase tester group aliases (create them in the
          # console). Override via a repo variable; defaults to `testers`.
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Firebase secrets not set — skipping App Distribution upload."
            exit 0
          fi
          # The service-account JSON is passed via a file, not an inline flag,
          # so it never lands in the process list or logs. The secret may be
          # stored as raw JSON or base64-encoded JSON (a common way to dodge
          # newline mangling) — accept either: raw JSON contains a '{', base64
          # never does, so that tells them apart.
          SA="$RUNNER_TEMP/firebase-sa.json"
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | grep -q '{'; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$SA" 2>/dev/null || true
          fi
          # Remove the key file on step exit — success, failure, or an early
          # validation bail-out — so it never lingers in $RUNNER_TEMP. (Steps run
          # under `bash -e`, so a non-zero command exits before any trailing
          # cleanup line would run; a trap is the only thing that always fires.)
          trap 'rm -f "$SA"' EXIT
          # Validate it really is a service-account key BEFORE calling firebase,
          # so a bad/empty/expired secret fails with a clear, non-sensitive
          # message instead of the opaque "have you run firebase login?" error.
          # Parse inside try/catch and NEVER print the parser error: on malformed
          # (e.g. truncated base64) JSON, Node would otherwise echo the offending
          # decoded source line — which can contain private-key material that
          # Actions masking (keyed on the base64 secret) won't redact. Only the
          # non-secret client_email is ever echoed.
          if ! node -e 'let j;try{j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"))}catch{process.exit(1)}if(j.type!=="service_account"||!j.client_email||!j.private_key){process.exit(1)}console.log("Firebase service account: "+j.client_email)' "$SA"; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT is not a valid service-account JSON (tried raw and base64). Re-create the key in Google Cloud → IAM → Service Accounts, grant it the 'Firebase App Distribution Admin' role, and store the downloaded JSON (raw, or base64 of it) in the secret."
            exit 1
          fi
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          # Set default release notes
          NOTES_CONTENT=""
          NOTES_TAG="docs/release-notes/${{ steps.meta.outputs.tag }}.md"
          NOTES_LABEL="docs/release-notes/${{ steps.meta.outputs.label }}.md"
          if [ -f "$NOTES_TAG" ]; then
            NOTES_CONTENT=$(cat "$NOTES_TAG")
          elif [ -n "${{ steps.meta.outputs.label }}" ] && [ -f "$NOTES_LABEL" ]; then
            NOTES_CONTENT=$(cat "$NOTES_LABEL")
          fi

          TITLE="${{ steps.meta.outputs.rel_name }} · ${{ steps.meta.outputs.sha_short }} (${{ github.ref_name }})"
          if [ -n "$NOTES_CONTENT" ]; then
            FB_NOTES="$TITLE"$'\n\n'"$NOTES_CONTENT"
          else
            FB_NOTES="$TITLE"
          fi

          # Upload + distribute via the App Distribution REST API directly. We
          # avoid `firebase-tools`, whose CLI service-account auth is broken in
          # CI — it ignores a valid GOOGLE_APPLICATION_CREDENTIALS and dies with
          # "Failed to authenticate, have you run firebase login?"
          # (firebase/firebase-tools#10041). A token minted straight from the SA
          # key works (verified in CI), so the script does exactly that.
          APK_PATH="dist/${{ steps.meta.outputs.apk }}" \
          RELEASE_NOTES="$FB_NOTES" \
            node scripts/firebase-app-distribution.mjs
          # The EXIT trap above removes the key; bash -e propagates any failure.

      # Run the Gemini-powered App Testing Agent on the just-uploaded release.
      # Requires the same Firebase secrets as the distribute step above, plus two
      # repo variables that are intentionally skipped when absent so the workflow
      # still runs without AI testing configured.
      #
      #   FIREBASE_TEST_CASES   comma-separated IDs from the Firebase console
      #                         App Distribution → Test Cases page
      #                         e.g. "load-app,complete-onboarding"
      #   FIREBASE_TEST_DEVICES semicolon-separated device specs
      #                         e.g. "model=shiba,version=34,locale=en,orientation=portrait"
      #
      # Optional variables:
      #   FIREBASE_TEST_NON_BLOCKING  set to "true" to launch tests and exit
      #                               without waiting for results (default: wait)
      #   FIREBASE_TEST_USERNAME / FIREBASE_TEST_PASSWORD  auto-login credentials
      #
      # Setup: docs/development/releasing.md → "App Testing Agent".
      - name: Run App Testing Agent (when configured)
        id: firebase-test
        if: >-
          steps.firebase-distribute.outputs.release_name != '' &&
          vars.FIREBASE_TEST_CASES != '' &&
          vars.FIREBASE_TEST_DEVICES != ''
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          RELEASE_NAME: ${{ steps.firebase-distribute.outputs.release_name }}
          TEST_CASES: ${{ vars.FIREBASE_TEST_CASES }}
          TEST_DEVICES: ${{ vars.FIREBASE_TEST_DEVICES }}
          TEST_NON_BLOCKING: ${{ vars.FIREBASE_TEST_NON_BLOCKING || 'false' }}
          TEST_USERNAME: ${{ secrets.FIREBASE_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.FIREBASE_TEST_PASSWORD }}
          TEST_USERNAME_RESOURCE: ${{ vars.FIREBASE_TEST_USERNAME_RESOURCE }}
          TEST_PASSWORD_RESOURCE: ${{ vars.FIREBASE_TEST_PASSWORD_RESOURCE }}
        run: |
          SA="$RUNNER_TEMP/firebase-sa.json"
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | grep -q '{'; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$SA" 2>/dev/null || true
          fi
          trap 'rm -f "$SA"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          node scripts/firebase-app-distribution-test.mjs
