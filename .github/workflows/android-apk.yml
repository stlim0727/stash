name: Android APK

# Builds a standalone, installable Android APK in CI (no EAS account needed):
# expo prebuild → Gradle assembleRelease. The RN/Expo template signs the
# `release` build type with the debug keystore and bundles the JS, so the APK
# installs and runs on a device on its own.
#
# Every build publishes a GitHub Release with the raw .apk + an install QR code
# (download the Release asset — no artifact zip to unpack):
# - clean `vX.Y.Z` (pushed tag or dispatch input): a versioned prerelease.
# - blank dispatch or a hyphenated tag (e.g. v0.1.0-test1): refreshes the single
#   rolling `dev` prerelease in place, so test builds don't clutter Releases.
# The APK is also uploaded as a run artifact for tooling that consumes it.
#
# Optional build-time config via repo secrets (absent ⇒ local-only build):
#   EXPO_PUBLIC_SUPABASE_URL, EXPO_PUBLIC_SUPABASE_ANON_KEY, EXPO_PUBLIC_SENTRY_DSN

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to publish a Release at (e.g. v0.1.0). Blank = artifact only.'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # A hoisted (npm-like) layout is friendliest for React Native Gradle
      # autolinking; pnpm's default isolated symlinks can confuse it.
      - name: Install dependencies (hoisted)
        run: |
          echo "node-linker=hoisted" >> .npmrc
          pnpm install --no-frozen-lockfile

      # Cache Gradle deps/transforms + the local build cache across runs.
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'apps/mobile/package.json') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # Cache the C++ compiler outputs (ccache). `expo prebuild` regenerates the
      # android/ dir each run, so the NDK build can't be cached in-tree — but
      # ccache lives outside it and turns the slow reanimated/folly/fabric
      # recompiles into cache hits on subsequent builds.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Give Gradle more heap
        working-directory: apps/mobile/android
        # Leading/trailing newlines so this lands on its own line even if the
        # generated gradle.properties has no trailing newline (a later duplicate
        # key overrides the template's value).
        # org.gradle.caching enables the local build cache (persisted via the
        # ~/.gradle cache above), so unchanged module compiles are reused.
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\norg.gradle.caching=true\n' >> gradle.properties

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          # Build provenance — inlined into the bundle and shown in Settings so
          # any installed APK self-identifies which commit it was built from.
          EXPO_PUBLIC_GIT_SHA: ${{ github.sha }}
          EXPO_PUBLIC_GIT_REF: ${{ github.ref_name }}
          EXPO_PUBLIC_COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          # Route NDK C++ compiles through ccache (cached across runs above).
          USE_CCACHE: '1'
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 3G
        # Build only the arm64-v8a ABI — every modern Android phone — to keep
        # the cold-cache native (NDK) compile fast and the APK small.
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --build-cache -PreactNativeArchitectures=arm64-v8a

      # Decide where this build is published. A clean vX.Y.Z (pushed tag or
      # dispatch input) is a real, versioned prerelease kept forever. Anything
      # else — a blank dispatch or a hyphenated pre-release tag — refreshes a
      # single rolling `dev` prerelease in place (stable tag + filename), so the
      # Releases list stays tidy instead of growing one entry per test build.
      - name: Determine release target
        id: meta
        run: |
          SHA_SHORT="${GITHUB_SHA:0:7}"
          LABEL=""
          if [ -n "${{ inputs.version }}" ]; then
            LABEL="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            LABEL="${{ github.ref_name }}"
          fi
          if [[ "$LABEL" == v* && "$LABEL" != *-* ]]; then
            TAG="$LABEL"
            APK="stash-${LABEL}-${SHA_SHORT}-android.apk"
            REL_NAME="Stash $LABEL"
          else
            TAG="dev"
            APK="stash-dev-android.apk"
            REL_NAME="Development build (latest)"
          fi
          URL="${{ github.server_url }}/${{ github.repository }}/releases/download/${TAG}/${APK}"
          {
            echo "tag=$TAG"
            echo "apk=$APK"
            echo "rel_name=$REL_NAME"
            echo "sha_short=$SHA_SHORT"
            echo "url=$URL"
          } >> "$GITHUB_OUTPUT"

      - name: Stage the APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk \
             "dist/${{ steps.meta.outputs.apk }}"
          ls -la dist

      # When Supabase is configured, verify Expo actually inlined the URL into
      # the release bundle. Catches the "dynamic process.env reads empty in
      # production" class of bug that unit tests can't see.
      - name: Assert EXPO_PUBLIC_SUPABASE_URL inlined (when configured)
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: |
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "No Supabase URL secret — local-only build; skipping inline assertion."
            exit 0
          fi
          APK=$(ls dist/stash-*-android.apk | head -1)
          rm -rf /tmp/apkassets && unzip -o -q "$APK" 'assets/*' -d /tmp/apkassets || true
          BUNDLE=$(find /tmp/apkassets -name '*.bundle' | head -1)
          if [ -z "$BUNDLE" ]; then
            echo "::warning::No JS bundle found in the APK to verify; skipping."
            exit 0
          fi
          if grep -aqF ".supabase.co" "$BUNDLE"; then
            echo "✓ Supabase URL inlined into the release bundle."
          else
            echo "::error::EXPO_PUBLIC_SUPABASE_URL was set but '.supabase.co' is absent from the release bundle — Expo did not inline it (likely dynamic process.env access)."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: stash-android-apk
          path: dist/*.apk
          if-no-files-found: error

      # Encode the direct Release download URL as a QR code, attached to the
      # Release and embedded in its notes. Scanning it on a phone goes straight
      # to the .apk — no desktop, no artifact zip to unpack.
      - name: Generate install QR code
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq qrencode
          qrencode -o dist/install-qr.png -s 8 -m 2 "${{ steps.meta.outputs.url }}"
          ls -la dist

      # The rolling `dev` tag is reused across builds. softprops updates the
      # release + assets but won't move an existing tag (`target_commitish` is
      # ignored once the tag exists), so force-point `dev` at this commit first —
      # otherwise the tag and its source archives stay on the first dev build
      # while the APK/body are from this one. Versioned tags are new each build,
      # so they don't need this. `dev` doesn't match the `v*` push trigger, so
      # this doesn't re-trigger the workflow.
      - name: Repoint rolling dev tag at this commit
        if: ${{ steps.meta.outputs.tag == 'dev' }}
        run: |
          git tag -f dev "$GITHUB_SHA"
          git push -f origin "refs/tags/dev"

      # Every build now publishes a Release with the raw .apk + QR. Versioned
      # builds get their own tag; everything else refreshes the rolling `dev`
      # prerelease in place. The action creates/updates the tag at this commit,
      # so no tag has to be pushed from a constrained environment.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.meta.outputs.rel_name }}
          files: |
            dist/*.apk
            dist/install-qr.png
          body: |
            Standalone debug-signed Android APK built in CI.

            **Commit** [`${{ steps.meta.outputs.sha_short }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}) · `${{ github.ref_name }}`

            ### 📲 Install on Android
            Scan this on your phone (or open the link), then tap the downloaded
            `.apk` to install. The first time, allow "install unknown apps" for
            your browser when prompted.

            ![Install QR](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag }}/install-qr.png)

            ➡️ **[Download ${{ steps.meta.outputs.apk }}](${{ steps.meta.outputs.url }})**

            Local-only unless the repo's `EXPO_PUBLIC_SUPABASE_*` secrets were set
            at build time.

      # Distribute to testers via Firebase App Distribution when configured.
      # Testers install through the "App Tester" app: no per-build unknown-sources
      # toggle, and each build pushes a notification. Skips cleanly when the
      # secrets are absent, so the workflow still runs without Firebase set up.
      # Setup: docs/development/releasing.md → "Firebase App Distribution".
      - name: Distribute to Firebase App Distribution (when configured)
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Comma-separated Firebase tester group aliases (create them in the
          # console). Override via a repo variable; defaults to `testers`.
          FIREBASE_TESTER_GROUPS: ${{ vars.FIREBASE_TESTER_GROUPS || 'testers' }}
        run: |
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Firebase secrets not set — skipping App Distribution upload."
            exit 0
          fi
          # The service-account JSON is passed via a file, not an inline flag,
          # so it never lands in the process list or logs.
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/firebase-sa.json"
          npx --yes firebase-tools appdistribution:distribute \
            "dist/${{ steps.meta.outputs.apk }}" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUPS" \
            --release-notes "${{ steps.meta.outputs.rel_name }} · ${{ steps.meta.outputs.sha_short }} (${{ github.ref_name }})"
          rm -f "$RUNNER_TEMP/firebase-sa.json"
