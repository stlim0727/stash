name: Secrets check

# Diagnostic: reports whether the Actions runner can see the EXPO_PUBLIC_*
# repository secrets. Prints only presence + length — never the values
# (GitHub also masks secret values in logs). Safe to keep or delete.

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Report secret presence (values never printed)
        env:
          URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL      present=${URL:+yes} length=${#URL}"
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY present=${KEY:+yes} length=${#KEY}"
          echo "EXPO_PUBLIC_SENTRY_DSN        present=${DSN:+yes} length=${#DSN}"
          case "$URL" in
            https://*.supabase.co|https://*.supabase.co/) echo "URL shape: looks like a Supabase URL" ;;
            "") echo "URL shape: EMPTY (secret not visible to Actions)" ;;
            *) echo "URL shape: non-empty but not https://<ref>.supabase.co" ;;
          esac
