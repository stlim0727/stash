name: Supabase live check

# Post-merge/scheduled health checks against the LIVE production Supabase
# project — separate from the ci.yml/CircleCI gate, which never touches
# production. Exists because STASH-5V/5T/5W traced back to a migration
# (20260712000000_realtime_broadcast_policies.sql) that was merged to main
# but never applied to production: nothing caught the drift until users hit
# the resulting Realtime failure in the wild.
#
# Two independent jobs:
#   - migration-drift: compares supabase/migrations/*.sql against what the
#     Management API says is actually applied. Read-only, no data created, so
#     it's safe to run unattended on a schedule. Needs a SUPABASE_ACCESS_TOKEN
#     secret (a Supabase *account* personal access token, Dashboard ->
#     Account -> Access Tokens — not the project anon/service key). Skips
#     itself with a clear message if that secret isn't set yet.
#   - verify-supabase: runs the existing `pnpm verify:supabase` E2E script
#     (16 checks against the real project, including a Realtime channel-join
#     check per account type) using the EXPO_PUBLIC_SUPABASE_* secrets already
#     used by android-apk.yml. This alone would have caught the Realtime bug.
#     Deliberately workflow_dispatch-only, NOT scheduled: it creates real
#     anonymous + real accounts (and a bookmark) in production each run and
#     only signs them out afterward, it doesn't delete them. The
#     `cleanup_anonymous_users` pg_cron job (20260628062523_anon_user_cleanup)
#     can't reap them either — its eligibility check requires zero rows in
#     public.bookmarks for the user, but this app's delete is archive-by-default
#     (the row's `deleted_at` gets set, the row itself doesn't disappear), so
#     the leftover archived bookmark permanently disqualifies the account. A
#     nightly run would accumulate orphaned auth.users + bookmarks rows in
#     prod forever. Run it by hand when you want the live signal; don't wire
#     it to a schedule without first giving verify-supabase.mjs a real
#     teardown path (needs a service-role key it doesn't currently have).
#
# migration-drift runs on a schedule (safety net) and right after anything
# touching supabase/migrations/ merges to main (fast feedback), plus manual
# dispatch. Independent of the CI_PROVIDER gate switch — this isn't ported to
# CircleCI (whose scheduler doesn't work for this project; see
# docs/development/ci-circleci.md).

on:
  schedule:
    - cron: '30 5 * * *' # nightly, offset from the Firebase cleanup at 04:17
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch: {}

jobs:
  migration-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for unapplied migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
        run: node scripts/check-migration-drift.mjs

  verify-supabase:
    # Manual only — see the "deliberately workflow_dispatch-only" note above.
    # Also skips (whole job, no runner spent) when the secrets aren't set.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      secrets.EXPO_PUBLIC_SUPABASE_URL != '' &&
      secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify live Supabase behavior
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm verify:supabase
