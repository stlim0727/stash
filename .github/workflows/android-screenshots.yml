name: Android Screenshots

# Renders the app on a real Android emulator in CI and captures screenshots of
# key screens (Inbox + the Browse facet shelf). This is the ONLY verification
# layer that catches Android-native layout bugs like chip clipping — unit tests
# and the web export cannot reproduce native ScrollView/text-measurement
# behaviour.
#
# Output: PNGs uploaded as a run artifact for human/diff review. The Maestro
# flow also asserts that key UI is visible, so a crash or a missing Browse shelf
# fails the job (a real, if coarse, signal).
#
# Cost note: booting an emulator is ~3-5 min and occasionally flaky, and most
# PRs don't need a native render, so this is OPT-IN rather than automatic. It
# runs:
#   - AUTOMATICALLY when a PR changes screen code (apps/mobile/src/app/**): the
#     `detect` job below sets ui=true and the emulator job gates on it, so a
#     layout regression in the screens (e.g. an oversized wordmark) is caught
#     without anyone remembering to add a label;
#   - ON DEMAND for anything else: add the `screenshots` label to a PR (re-runs
#     on each push while labelled), or trigger it manually (workflow_dispatch).
# A PR that touches no screen code and carries no label costs nothing — the
# `detect` job is seconds and the emulator job is skipped.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, labeled, synchronize, reopened]

# One emulator run per ref; cancel superseded runs on rapid pushes.
concurrency:
  group: android-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds-cheap gate: does this PR touch screen code? Its `ui` output drives
  # the emulator job, so UI changes auto-render without needing a label. Uses
  # the PR's file list via `gh` (no checkout/clone needed).
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # No PR context (manual dispatch) → ui=false; the screenshots job's own
          # workflow_dispatch clause still runs it.
          if [ -z "${PR:-}" ]; then echo "ui=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          files=$(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$files" | grep -qE '^apps/mobile/src/app/'; then
            echo "Screen code changed → screenshots will run."
            echo "ui=true" >> "$GITHUB_OUTPUT"
          else
            echo "No screen code changed → screenshots skipped (label to force)."
            echo "ui=false" >> "$GITHUB_OUTPUT"
          fi

  screenshots:
    needs: detect
    # Run on manual dispatch, when the PR carries the `screenshots` label, OR
    # when the PR changed screen code (apps/mobile/src/app/**). Other PRs skip,
    # spending no emulator minutes.
    if: >-
      github.event_name == 'workflow_dispatch'
      || contains(github.event.pull_request.labels.*.name, 'screenshots')
      || needs.detect.outputs.ui == 'true'
    runs-on: ubuntu-latest
    # A clean run is ~12-15 min, but the x86_64 build is ~11 min on its own and
    # ~1 in 3 emulators boot broken — so a flake plus the fresh-emulator retry
    # below can need ~33 min. 30 was guillotining that retry mid-render (run
    # cancelled, zero screenshots); 45 lets the retry actually finish while still
    # capping a truly-hung emulator well under the 6h default.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      # Current GitHub-hosted Ubuntu runners ship KVM but don't expose it to the
      # job by default. Without it the emulator falls back to software rendering
      # — it boots in minutes and the system server dies mid-boot
      # (android.os.DeadSystemException). This udev rule is the documented
      # requirement of android-emulator-runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # A hoisted (npm-like) layout is friendliest for React Native Gradle
      # autolinking; pnpm's default isolated symlinks can confuse it.
      - name: Install dependencies (hoisted)
        run: |
          echo "node-linker=hoisted" >> .npmrc
          pnpm install --no-frozen-lockfile

      # Restore Gradle deps/transforms + local build cache. Split into restore +
      # save (see the save step after the build) so the Gradle build cache grows
      # run-over-run: actions/cache@v4 skips saving on a cache hit, so a combined
      # step keyed on the lockfile never persists new task outputs past the first
      # cold build for a given dependency set. Keyed by sha (fresh entry each run)
      # with prefix fallback picks up the most recent cache — matching android-apk.yml.
      - name: Restore Gradle cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ccache survives the in-tree android/ regen that `expo prebuild` does each
      # run, turning the slow NDK recompiles into cache hits on later builds.
      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-screens-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            ccache-screens-${{ runner.os }}-

      # Ensure the ccache binary is present and zero its run stats so the
      # post-build `ccache -s` reflects only this build.
      - name: Install ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          ccache --version | head -1
          ccache -z

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Metro transform cache: Metro caches per-file transform results in
      # /tmp/metro-*. Without this, every run re-transforms all source files even
      # though most haven't changed, so bundleReleaseJsAndAssets — the single
      # biggest chunk of the release build — runs cold each time. Restoring it lets
      # Metro skip unchanged files (same fix as android-apk.yml).
      #
      # Namespaced `metro-screens-` — deliberately NOT shared with android-apk.yml's
      # `metro-` cache. Metro's content-keyed transform cache does NOT bust on
      # EXPO_PUBLIC_* changes (that's why provenance is routed through expoConfig
      # `extra`, not inlined — see android-apk.yml + domain/build-info.ts). This
      # screenshots build runs with NO EXPO_PUBLIC_SUPABASE_URL/SENTRY_DSN, so its
      # transforms inline empty config; sharing the namespace would let a later
      # release APK restore those no-env transforms and ship with Supabase/Sentry
      # config missing. Isolating keeps release inlining correct — each workflow
      # still warms its own cache run-over-run (matching the ccache-screens- split).
      - name: Restore Metro cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/metro-*
          key: metro-screens-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            metro-screens-${{ runner.os }}-

      - name: Prebuild Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Give Gradle more heap
        working-directory: apps/mobile/android
        run: printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\norg.gradle.caching=true\n' >> gradle.properties

      # Build the release variant — it is self-contained (bundles the JS, signs
      # with the debug keystore) so it installs and runs WITHOUT a Metro server.
      # Target x86_64 because the CI emulator is x86_64; an arm64-only APK would
      # not install on it.
      - name: Build APK (x86_64)
        working-directory: apps/mobile/android
        env:
          # Route every CMake/NDK C++ compile through ccache. RN only wires ccache
          # when building RN itself from source, so for a prebuilt-RN app build (and
          # third-party native modules) USE_CCACHE was a no-op and the compiles ran
          # cold every run. CMake reads CMAKE_<LANG>_COMPILER_LAUNCHER from the env,
          # so these make every module use ccache regardless of RN/Expo internals.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 3G
          # expo prebuild regenerates android/ each run, shifting absolute paths;
          # CCACHE_BASEDIR rewrites them to relative so cached objects still hit.
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_COMPILERCHECK: content
          # NOHASHDIR drops the per-run .cxx/<hash> build dir from the hash so the
          # same source hits run-over-run (only affects debug-symbol paths);
          # `locale` ignores LC_* so a runner locale change can't bust the cache.
          CCACHE_NOHASHDIR: 'true'
          CCACHE_SLOPPINESS: time_macros,include_file_mtime,include_file_ctime,pch_defines,locale
        # `-x lintVitalRelease` skips AGP's release-lint chain (~2 min) — pointless
        # for a throwaway screenshot APK.
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --build-cache -PreactNativeArchitectures=x86_64 -x lintVitalRelease

      # Surface ccache's hit/miss so a regression back to 0% hits is visible.
      - name: ccache stats
        if: always()
        run: ccache -s

      # Save the Gradle + Metro caches now, BEFORE the flaky emulator phase — a
      # dead emulator can burn the 45-min budget and get the job cancelled, which
      # would drop a post-job save and lose this build's warmed caches. Keyed by
      # sha so every run writes a fresh entry; the restore steps above fall back
      # via prefix to the most recent one.
      - name: Save Gradle cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ github.sha }}

      - name: Save Metro cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/metro-*
          key: metro-screens-${{ runner.os }}-${{ github.sha }}

      # The emulator boot is the flaky part (#269): ~1 in 3 CI emulators boot
      # with a broken UiAutomator layer (every element reads "not found"), and
      # some never bring the device up at all ("device 'emulator-5554' not
      # found" → "Timeout waiting for emulator to boot"). A dead emulator can't
      # be recovered in place, so we retry at the JOB level on a fresh emulator —
      # now up to THREE attempts, since two consecutive boot failures have been
      # seen. Each attempt is hardened: explicit cores/RAM, and a 5-min boot cap
      # (a healthy emulator boots in ~2-4 min; a dead one — which spams
      # "device 'emulator-5554' not found" as the action polls sys.boot_completed
      # against a QEMU process that already exited — is abandoned fast so all
      # three attempts still fit the 45-min job budget). `default` (AOSP)
      # images avoid the Google Play Services dialogs that can steal the
      # foreground. (GitHub Actions doesn't reliably support YAML anchors, so the
      # three attempts duplicate the same hardened `with:` block.)
      - name: Run Maestro flows on emulator
        id: emu1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          # Fail a dead boot fast (default is 600s) so retries fit the budget.
          # 300s = ~5 min: still generous over a healthy ~2-4 min boot, but a
          # dead emulator is abandoned ~2 min sooner than the old 420s.
          emulator-boot-timeout: 300
          disable-animations: true
          # Headless, accelerated, no extras that slow boot or destabilise the
          # system server on CI.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # android-emulator-runner runs `script` line-by-line (each line is its
          # own `sh -c`), so loops/cd/vars must live in a real script file.
          script: bash "$GITHUB_WORKSPACE/apps/mobile/.maestro/run-ci-screenshots.sh"

      # Attempt 2 on a brand-new emulator, only if attempt 1 failed. Also
      # continue-on-error so attempt 3 can still run after it.
      - name: Run Maestro flows on emulator (retry, fresh emulator)
        id: emu2
        if: steps.emu1.outcome == 'failure'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/apps/mobile/.maestro/run-ci-screenshots.sh"

      # Attempt 3 — last roll on yet another fresh emulator. Two prior boots both
      # failing is usually a transient runner/KVM issue that a third try clears.
      - name: Run Maestro flows on emulator (retry 2, fresh emulator)
        id: emu3
        if: steps.emu1.outcome == 'failure' && steps.emu2.outcome == 'failure'
        # continue-on-error so a total boot failure (all 3 attempts) is handled
        # by the guard below as a non-blocking infra skip, not a hard job failure
        # — otherwise the auto-trigger on UI PRs (#268) would red-X every PR
        # whenever the GitHub runner can't boot an emulator (a real outage seen
        # 2026-06-28). A genuine visual regression still fails via the diff step.
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          emulator-boot-timeout: 300
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/apps/mobile/.maestro/run-ci-screenshots.sh"

      # Infra guard: if NO screenshots were produced, every emulator attempt
      # failed to boot — that's a runner/KVM issue, not a code regression, so
      # warn (visible annotation) but do NOT fail the job. Keeps a runner outage
      # from red-Xing every UI PR via the auto-trigger (#268). Trade-off: a true
      # "app booted but rendered nothing" crash also reads as a skip here; that's
      # acceptable while the emulator is the bottleneck (see #269 — managed
      # devices remove this), and the APK build/distribution has its own signal.
      - name: Guard — no screenshots (emulator never booted)
        if: hashFiles('screenshots/*.png') == ''
        run: |
          echo "::warning title=Screenshots skipped::All emulator attempts produced no screenshots (boot failure / infra). The visual-regression gate did not run — NOT a code failure. Re-run when the runner recovers, or move to a managed device service (#269)."

      # Visual-regression gate (issue #269, item 2): pixel-diff the captured
      # screenshots against the committed baselines and FAIL on a layout change
      # — including a resized element, which Maestro's assertVisible can't catch
      # (exactly the rc11/rc12 wordmark miss). Only runs when screenshots exist;
      # a no-op until baselines are committed. To update baselines after an
      # INTENTIONAL change, commit the new PNGs from the uploaded artifact.
      - name: Visual regression diff
        if: hashFiles('screenshots/*.png') != ''
        env:
          BASELINE_DIR: apps/mobile/.maestro/baselines
          NEW_DIR: screenshots
          OUT_DIR: screenshots/diff
        run: node scripts/screenshot-diff.mjs

      - uses: actions/upload-artifact@v4
        # Upload even on failure: the screenshot — and the diff image when the
        # gate trips — of the broken state is exactly what you want here. `warn`
        # (not `error`) so the empty-output infra case is handled by the guard
        # above, not a second hard failure here.
        if: always()
        with:
          name: android-screenshots
          path: |
            screenshots/*.png
            screenshots/diff/*.png
          if-no-files-found: warn
