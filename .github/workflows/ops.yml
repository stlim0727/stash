# Manual "ops" workflow — a phone-friendly remote shell for `gh`.
#
# Why this exists: in some environments (the Claude Code mobile/web session, a
# phone with no PC) the `gh` CLI isn't usable directly — outbound GitHub API
# access is gated. GitHub-hosted runners, by contrast, ship `gh` preinstalled
# and get a scoped `GITHUB_TOKEN` for free. So instead of running `gh` locally,
# dispatch this workflow (one tap from the GitHub mobile app, or via the
# Claude session's `actions_run_trigger`) and let the runner execute it for you.
#
# Only collaborators with write access can trigger workflow_dispatch, so the
# free-form `run-command` task is as privileged as a normal push — no more.
name: Ops (manual)

on:
  # Daily automatic prune: delete artifacts older than 3 days so the account's
  # Actions artifact storage quota can't refill and start failing CI uploads
  # again (see android-apk.yml / ci.yml notes). Manual dispatch (below) still
  # offers the full task menu, including a one-off older-than-N or delete-all.
  schedule:
    - cron: '17 4 * * *' # daily 04:17 UTC (off-peak, off the :00/:30 rush)
  workflow_dispatch:
    inputs:
      task:
        description: What to do
        type: choice
        default: list-artifacts
        options:
          - list-artifacts
          - delete-all-artifacts
          - delete-artifacts-older-than-days
          - firebase-list-releases
          - firebase-delete-old-releases
          - run-command
      days:
        description: "Age threshold in days (delete-artifacts-older-than-days, firebase-delete-old-releases)"
        type: string
        required: false
        default: "7"
      keep:
        description: "Keep the N most recent Firebase releases (firebase-* tasks)"
        type: string
        required: false
        default: "20"
      command:
        description: "Shell command to run; `gh` is available (for run-command)"
        type: string
        required: false

# Deleting artifacts/logs needs actions:write; everything else is read-only.
permissions:
  contents: read
  actions: write

jobs:
  ops:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: List artifacts
        if: inputs.task == 'list-artifacts'
        run: |
          set -euo pipefail
          echo "Artifacts in $REPO (id / created_at / size / name):"
          gh api "repos/$REPO/actions/artifacts" --paginate \
            --jq '.artifacts[] | "\(.id)\t\(.created_at)\t\(.size_in_bytes)\t\(.name)"' \
            | sort -k2 || echo "(none)"

      - name: Delete all artifacts
        if: inputs.task == 'delete-all-artifacts'
        run: |
          set -euo pipefail
          ids=$(gh api "repos/$REPO/actions/artifacts" --paginate --jq '.artifacts[].id')
          if [ -z "$ids" ]; then echo "No artifacts to delete."; exit 0; fi
          for id in $ids; do
            echo "Deleting artifact $id"
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
          done
          echo "Done."

      - name: Delete artifacts older than N days
        # The manual task OR the daily scheduled prune (which carries no inputs).
        if: inputs.task == 'delete-artifacts-older-than-days' || github.event_name == 'schedule'
        env:
          # Scheduled runs have no inputs → default to 3 days; a manual dispatch
          # uses the chosen value (its own input default is 7).
          DAYS: ${{ inputs.days || '3' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${DAYS} days ago" +%s)
          echo "Deleting artifacts created before $(date -u -d @"$cutoff" +%FT%TZ)"
          deleted=0
          gh api "repos/$REPO/actions/artifacts" --paginate \
            --jq '.artifacts[] | "\(.id) \(.created_at)"' \
          | while read -r id created; do
              ts=$(date -u -d "$created" +%s)
              if [ "$ts" -lt "$cutoff" ]; then
                echo "Deleting artifact $id ($created)"
                gh api -X DELETE "repos/$REPO/actions/artifacts/$id"
                deleted=$((deleted + 1))
              fi
            done
          echo "Done."

# --- Firebase App Distribution cleanup ---------------------------------------
# These tasks need the cleanup script from the repo, so check it out first.
      - name: Checkout (for Firebase tasks)
        if: startsWith(inputs.task, 'firebase-')
        uses: actions/checkout@v4

      # Prune old App Distribution releases via the REST API + service account.
      # firebase-list-releases is a dry run (reports what would go); the actual
      # delete only runs for firebase-delete-old-releases. Skips cleanly when the
      # Firebase secrets aren't configured. SA-key handling mirrors android-apk.yml.
      - name: Firebase release cleanup
        if: startsWith(inputs.task, 'firebase-')
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          KEEP: ${{ inputs.keep }}
          MAX_AGE_DAYS: ${{ inputs.days }}
          DRY_RUN: ${{ inputs.task == 'firebase-list-releases' }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_APP_ID" ] || [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Firebase secrets not set — nothing to clean up."
            exit 0
          fi
          # SA JSON via a file (never inline) so it can't leak into logs/process
          # list. The secret may be raw JSON or base64-encoded JSON: raw contains
          # a '{', base64 never does, so that tells them apart.
          SA="$RUNNER_TEMP/firebase-sa.json"
          if printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | grep -q '{'; then
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$SA"
          else
            printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | base64 -d > "$SA" 2>/dev/null || true
          fi
          trap 'rm -f "$SA"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$SA"
          node scripts/firebase-app-distribution-cleanup.mjs

      # Free-form escape hatch: run any shell/gh command. The command is passed
      # via env (not interpolated into the script) so quoting can't break it or
      # inject extra steps.
      - name: Run command
        if: inputs.task == 'run-command'
        env:
          CMD: ${{ inputs.command }}
        run: |
          set -euo pipefail
          if [ -z "${CMD:-}" ]; then
            echo "No command provided." >&2
            exit 1
          fi
          echo "::group::command"
          printf '%s\n' "$CMD"
          echo "::endgroup::"
          bash -c "$CMD"
