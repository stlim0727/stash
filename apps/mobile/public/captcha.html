<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Keepory cloud sync verification</title>
  <link rel="stylesheet" href="/captcha.css">
  <script src="/captcha.js" defer></script>
</head>
<body>
  <main>
    <h1 id="title">Verify cloud sync</h1>
    <p id="description">Your saved items remain on this device. Complete the check below to start cloud sync.</p>
    <div id="challenge"></div>
    <p id="status" role="status">Loading verification…</p>
    <button id="return" type="button">Return to Keepory</button>
  </main>
</body>
</html>
