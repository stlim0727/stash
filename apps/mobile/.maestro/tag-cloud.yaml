# Smoke + screenshot flow for the dedicated "Browse by tag" route (/browse/tags).
# Runs on a CI Android emulator (see .github/workflows/android-screenshots.yml).
#
# Renders the deterministic first-run seed (mock tags / read-later / local-
# first), opens the tag-browse route from the Inbox toggle, and captures the
# word cloud — the one surface unit tests and the web export can't show on a real
# Android touch surface.
#
# The in-Inbox transient cloud (and its STASH-7 same-screen overlay assertion)
# was retired: the cloud now lives on its own pushed route with a static native
# header, so the header no longer floats over a full-screen cloud ScrollView. The
# hard CI gate for the overlay-elevation bug class remains `pnpm lint:overlay`
# (scripts/check-overlay-elevation.mjs) in ci.yml.
#
# NOTE: the screenshots runner invokes `maestro test ... || true`, so a selector
# hiccup is VISIBLE in the logs but does not by itself gate the build.
appId: com.stash.app
---
- launchApp:
    clearState: true
- assertVisible: 'Stash'
# Open the dedicated tag-browse route from the header toggle. The route lands on
# the word cloud, which renders each seed tag as "#name".
- tapOn:
    id: 'inbox-browse-tags-toggle'
- assertVisible:
    id: 'browse-tags-cloud'
- assertVisible: '#design'
- takeScreenshot: tag-cloud
# Toggle to the full virtualized list, then back to the cloud — both surfaces
# render on the route's own screen.
- tapOn:
    id: 'browse-tags-view-all'
- assertVisible:
    id: 'browse-tags-list'
- tapOn:
    id: 'browse-tags-view-cloud'
- assertVisible:
    id: 'browse-tags-cloud'
