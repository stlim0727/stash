# HyperExecute config — run our Maestro flows on TestMu AI (LambdaTest) REAL
# Android devices, to escape the GitHub-runner emulator boot flakiness (#269 3a).
# Adapted from LambdaTest/hyperexecute-maestro-sample-test (yaml/android-realdevice.yaml).
#
# Paths are relative to the repo root (the dir the HyperExecute CLI uploads).
# First cut — validated/iterated via one real run; see the cloud workflow.
version: "0.2"
autosplit: true
# Spread the 8 flows across 2 devices. Lower to 1 if the free tier limits parallel.
concurrency: 2
runson: android
dynamicAllocation: true

runtime:
  - language: java
    version: "21"

framework:
  name: raw
  args:
    # Device-OSversion (regex allowed, e.g. ["Pixel.*-1[34]"]). Adjust to a
    # device the free tier actually offers if Pixel 6 / Android 14 is unavailable.
    devices: ["Pixel 6-14"]
    video: true
    deviceLog: true
    # Our app — placed here by the workflow (arm64 APK from the `dev` prerelease).
    appPath: apps/mobile/.maestro/hyperexecute/app.apk
    buildName: stash-screenshots
    queueTimeout: 600
    region: ap
    disableReleaseDevice: true
    isRealMobile: true
    reservation: false
    network: true
    platformName: android

env:
  MAESTRO: true
  MAESTRO_LOGS_DIR: MaestroLogs

pre:
  - chmod +x ./apps/mobile/.maestro/hyperexecute/setup-script.sh
  - chmod +x ./apps/mobile/.maestro/hyperexecute/runTest.sh
  - ./apps/mobile/.maestro/hyperexecute/setup-script.sh

testDiscovery:
  command: cat ./apps/mobile/.maestro/hyperexecute/discover.txt
  mode: static
  type: raw

testRunnerCommand: ./apps/mobile/.maestro/hyperexecute/runTest.sh $test

# The sample omits this, so screenshots never come back. takeScreenshot writes
# <name>.png to the cwd; collect every PNG so we can pull them down and feed the
# existing screenshot-diff.mjs gate (no SmartUI → execution minutes, not credits).
uploadArtefacts:
  - name: screenshots
    path:
      - "**/*.png"
  - name: maestro-logs
    path:
      - "MaestroLogs/**"

frameworkStatusOnly: true
report: true
partialReports:
  - location: .
    type: xml
    frameworkName: junit

jobLabel: ["stash", "maestro", "screenshots"]
