# Report a problem — reached from Settings. Scroll the row into view first since
# it can sit below the fold at larger font sizes.
appId: com.stash.app
---
- launchApp:
    clearState: true
- tapOn: 'Settings'
- scrollUntilVisible:
    element:
      text: 'Report a problem'
    direction: DOWN
- tapOn: 'Report a problem'
- assertVisible: 'Category'
- takeScreenshot: report
