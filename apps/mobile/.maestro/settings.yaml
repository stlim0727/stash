# Settings screen — reached from the Inbox via the gear (accessibility label
# "Settings"). Captured across font scales by the screenshots workflow.
appId: com.stash.app
---
- launchApp:
    clearState: true
- tapOn: 'Settings'
# Assert the FIRST settings row (top of screen) rather than "App version",
# which is the last row and falls below the fold at larger fonts.
- assertVisible: 'Account'
- takeScreenshot: settings
