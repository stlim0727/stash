# Bookmark Detail — open the deterministic seed bookmark "Local-first software"
# (id bookmark-local-first) from the Inbox list.
appId: com.stash.app
---
- launchApp:
    clearState: true
- tapOn: 'Local-first software'
# Scroll the detail-only "Title" field into view: it confirms we navigated to
# Detail and survives large fonts, where the action-bar buttons (Delete) overflow
# off-screen and the field drops below the fold.
- scrollUntilVisible:
    element:
      text: 'Title'
    direction: DOWN
- takeScreenshot: detail
