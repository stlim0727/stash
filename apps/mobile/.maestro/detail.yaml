# Bookmark Detail — open the deterministic seed bookmark "Local-first software"
# (id bookmark-local-first) from the Inbox list.
appId: com.stash.app
---
- launchApp:
    clearState: true
- tapOn: 'Local-first software'
# Assert on the Delete action (top action bar, detail-only) rather than the
# "Title" field, which sits lower and can fall below the fold at larger fonts.
- assertVisible: 'Delete'
- takeScreenshot: detail
