# Netlify config for the web PREVIEW site (stash-web-preview.netlify.app), driven
# by Netlify's Git integration: Netlify clones the repo and runs this build for
# every branch/PR, giving each an auto-deployed preview URL. This is preview-only
# and completely separate from PRODUCTION, which is Cloudflare Workers at
# keepory.app (see wrangler.toml + docs/development/deploy-web.md). See the
# web-preview skill for how it all fits together.

[build]
  # Same static Expo export as production; emits apps/mobile/dist.
  command = "pnpm install && cd apps/mobile && CI=1 pnpm exec expo export --platform web"
  publish = "apps/mobile/dist"

[build.environment]
  # Cloud sync is compiled into the bundle at build time. These are the PUBLIC
  # Supabase project URL + publishable (anon) key — safe to commit; they already
  # ship in every production web bundle, and RLS is what actually protects data.
  # Without them the preview still runs, but local-only (no sign-in / sync).
  EXPO_PUBLIC_SUPABASE_URL = "https://stzutoejnhzxzhjsjtsi.supabase.co"
  EXPO_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_TBMfShK_vzySRN6n3yRcpA_P-WXe-5n"
  # These EXPO_PUBLIC_* values are intentionally embedded in the client bundle,
  # so exempt them from Netlify's secrets scanner (which would otherwise fail the
  # build on finding them in the build output).
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_SUPABASE_URL,EXPO_PUBLIC_SUPABASE_ANON_KEY"

# expo-router exports an SPA (web.output "single"): index.html + assets only, no
# per-route HTML. Netlify serves real files first, then applies this catch-all,
# so every app route (/add, /settings, /auth/callback, /bookmark/<id>) resolves
# to index.html for client-side rendering. Safe here (unlike Cloudflare Pages).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
