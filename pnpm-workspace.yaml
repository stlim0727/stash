packages:
  - apps/*
  - packages/*

patchedDependencies:
  expo-share-intent@8.0.1: patches/expo-share-intent@8.0.1.patch
  react-native-web@0.21.2: patches/react-native-web@0.21.2.patch

# expo-share-intent 8 currently targets SDK 57. Keep its Expo modules on the
# app's SDK while preserving the native capture patch during the SDK 58 port.
overrides:
  'expo-share-intent>expo-constants': '~58.0.10'
  'expo-share-intent>expo-linking': '~58.0.11'
  'expo-share-intent>@expo/config-plugins': '~58.0.6'

# The checked-in patch ports this exact share-intent release to SDK 58.
peerDependencyRules:
  allowedVersions:
    'expo-share-intent@8.0.1>expo': '58'
