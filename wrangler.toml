# Cloudflare Workers config for the static web build (Workers Static Assets).
# The build command runs `expo export --platform web` into apps/mobile/dist,
# then `wrangler deploy` uploads that directory as an assets-only Worker — no
# Worker script (`main`) is needed. See docs/development/deploy-web.md.
#
# `name` must match the Worker/project name in the Cloudflare dashboard, so the
# Git build's `wrangler deploy` targets the right Worker. ("keepory" was already
# taken in the account, so the project was created as "keepory7"; the public URL
# is the keepory.app custom domain, not this internal name.)
name = "keepory7"
compatibility_date = "2026-07-03"

# Publish to the keepory.app custom domain, not a *.workers.dev subdomain. The
# account has no workers.dev subdomain registered, so wrangler's default
# (workers_dev = true) had nowhere to publish and failed the deploy at the final
# step ("register a workers.dev subdomain … or specify routes"). Declaring the
# custom domain here gives the deploy a target and keeps the site custom-domain-
# only (no public workers.dev URL). `custom_domain = true` attaches/verifies the
# domain on Cloudflare (idempotent once it's attached to this Worker); it assumes
# keepory.app is set up on the account per docs/development/deploy-web.md.
workers_dev = false
routes = [{ pattern = "keepory.app", custom_domain = true }]

# Build the static bundle as part of `wrangler deploy` — but ONLY as a fallback.
# `dist/` is gitignored, so without a build the deploy would upload a missing
# assets directory and fail.
#
# Phase ordering matters for build provenance. Cloudflare Workers Builds runs the
# dashboard "Build command" FIRST (the build phase, where WORKERS_CI_COMMIT_SHA /
# WORKERS_CI_BRANCH exist), then the "Deploy command" `npx wrangler deploy` —
# which is where THIS hook runs. The commit env vars are NOT present in that
# deploy phase (and `.git` may be absent too), so if this hook re-exported it
# would overwrite the build phase's provenance-stamped dist with an empty one.
#
# So: SKIP when dist already exists (the dashboard "Build command" — expected to
# be `bash scripts/web-build.sh` — built it in the build phase with provenance
# stamped). Only build here when dist is missing, as a self-contained safety net,
# via the same script (which falls back to git, then empty, for provenance).
[build]
command = 'if [ -d apps/mobile/dist ]; then echo "dist already built in the build phase; keeping its provenance, skipping deploy-phase re-export"; else bash scripts/web-build.sh; fi'

[assets]
# Path (relative to this file) to the exported static bundle.
directory = "./apps/mobile/dist"
# Serve /index.html for navigation requests that don't match a file — this is
# the SPA fallback for the dynamic /bookmark/<id> route and any deep link.
# Real assets (/_expo/*, /manifest.webmanifest, the PWA icons, /add, …) are
# matched and served directly first, so it never rewrites the app's own code.
not_found_handling = "single-page-application"
