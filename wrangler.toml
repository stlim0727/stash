# Cloudflare Workers config for the static web build (Workers Static Assets).
# The build command runs `expo export --platform web` into apps/mobile/dist,
# then `wrangler deploy` uploads that directory as an assets-only Worker — no
# Worker script (`main`) is needed. See docs/development/deploy-web.md.
#
# `name` must match the Worker/project name in the Cloudflare dashboard, so the
# Git build's `wrangler deploy` targets the right Worker. ("keepory" was already
# taken in the account, so the project was created as "keepory7"; the public URL
# is the keepory.app custom domain, not this internal name.)
name = "keepory7"
compatibility_date = "2026-07-03"

# Publish to the keepory.app custom domain, not a *.workers.dev subdomain. We
# keep this Worker's workers.dev route disabled (workers_dev = false) so the live
# site is custom-domain-only — no public *.workers.dev URL for production.
# (The account's workers.dev subdomain does exist — `stlim0727.workers.dev` — and
# is used only for preview URLs; see preview_urls below.) Declaring the custom
# domain here gives the deploy a target. `custom_domain = true` attaches/verifies
# the domain on Cloudflare (idempotent once it's attached to this Worker); it
# assumes keepory.app is set up on the account per docs/development/deploy-web.md.
workers_dev = false
routes = [{ pattern = "keepory.app", custom_domain = true }]

# Preview URLs for un-merged branches (the web-preview skill). With this on,
# Workers Builds runs `wrangler versions upload` for every non-production
# branch/PR and publishes it at https://<alias>-keepory7.stlim0727.workers.dev.
# Production (keepory.app) is unaffected — it stays custom-domain-only because
# workers_dev is false above; only preview *versions* get a workers.dev URL.
# Preview URLs default OFF when workers_dev is false, so we opt in explicitly.
# This needs the account's workers.dev subdomain, which is registered
# (stlim0727.workers.dev), so it does not break the production deploy.
preview_urls = true

# Build the static bundle as part of `wrangler deploy` itself, and stamp build
# provenance so Settings shows the deployed commit. This runs in the deploy phase.
# `dist/` is gitignored, so this also guarantees the assets directory exists.
#
# We build here unconditionally (rather than trusting a dashboard "Build command")
# because Cloudflare's commit env vars (WORKERS_CI_*) live only in the build phase,
# and the dashboard build-config form on this project currently rejects edits — so
# provenance has to be resolved here. scripts/web-build.sh derives the commit from
# WORKERS_CI_* → the git binary → reading `.git/HEAD` directly, whichever the
# deploy phase actually exposes, and degrades to "local build" (deploy still
# succeeds) if none are present. It overwrites any dist a dashboard build produced;
# that rebuild is the price of getting the commit stamped without dashboard access.
[build]
command = 'bash scripts/web-build.sh'

[assets]
# Path (relative to this file) to the exported static bundle.
directory = "./apps/mobile/dist"
# Serve /index.html for navigation requests that don't match a file — this is
# the SPA fallback for the dynamic /bookmark/<id> route and any deep link.
# Real assets (/_expo/*, /manifest.webmanifest, the PWA icons, /add, …) are
# matched and served directly first, so it never rewrites the app's own code.
not_found_handling = "single-page-application"
